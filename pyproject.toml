[project]
name = "repogym"
version = "0.1.0"
description = "reproducible benchmark for coding agents on real repositories"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
repogym = "repogym.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repogym"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["PLW1510", "PYI034"]
