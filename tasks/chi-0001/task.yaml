level: L2
source: mutated
prompt: |
  Since our last dependency bump, request logs behind our load balancer show the
  LB's internal IP (10.x.x.x) as the client address instead of the real client.

  We terminate at two proxies, so requests arrive with
  `X-Forwarded-For: <client>, <proxy1>, <proxy2>`. The RealIP middleware used to
  resolve the leftmost entry (the actual client); now it reports an internal
  proxy address. `X-Real-IP` requests are unaffected.

  Track down and fix the regression in the middleware.
mutation_patch: bug.patch
