  patch: tests.patch
  fail_to_pass:
    - tests/test_filters.py::TestFilter::test_filesizeformat
    - tests/test_filters.py::TestFilter::test_filesizeformat_issue59
    - tests/test_repogym_filesize.py::test_decimal_prefixes_use_base_1000
    - tests/test_repogym_filesize.py::test_binary_prefixes_use_base_1024
  pass_to_pass:
