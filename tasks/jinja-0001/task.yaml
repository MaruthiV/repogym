id: jinja-0001
repo: pallets/jinja
base_commit: 5ef70112a1ff19c05324ff889dd30405b1002044
language: python
category: bug_fix
level: L1
source: mutated
prompt: |
  The `filesizeformat` filter mixes up its unit bases. Decimal mode now treats
  a megabyte as 1024*1024 bytes while binary mode (`filesizeformat(true)`)
  divides by 1000, so `{{ 1000000|filesizeformat }}` renders "976.6 kB"
  instead of "1.0 MB" and the binary variant is wrong the other way around.

  Decimal prefixes (kB, MB, GB) must use base 1000 and binary prefixes
  (KiB, MiB, GiB) must use base 1024. Find and fix it.
mutation_patch: bug.patch
