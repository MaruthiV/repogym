language: python
category: bug_fix
level: L3
source: mined
prompt: "`compile_templates` is non-deterministic on `{% import ... as ... with context\
  \ %}`\n\nFollowing code generates non-deterministic compiled output.\r\n```python\r\
  \nfrom jinja2 import loaders\r\nfrom jinja2.environment import Environment\r\n\r\
  \nenv = Environment(loader=loaders.DictLoader({\"foo\": \"\"\"\r\n{% import \"bar\"\
  \ as bar with context %}\r\n{% import \"baz\" as baz with context %}\r\n\"\"\"}))\r\
  \n\r\nenv.compile_templates('archive', zip=None, ignore_errors=False)\r\n```\r\n\
  \r\n```diff\r\n from __future__ import generator_stop\r\n from jinja2.runtime import\
  \ LoopContext, Macro, Markup, Namespace, TemplateNotFound, TemplateReference, TemplateRuntimeError,\
  \ Undefined, concat, escape, identity, internalcode, markup_join, missing, str_join\r\
  \n name = 'foo'\r\n\r\n def root(context, missing=missing):\r\n     resolve = context.resolve_or_missing\r\
  \n     undefined = environment.undefined\r\n     cond_expr_undefined = Undefined\r\
  \n     if 0: yield None\r\n     l_0_bar = l_0_baz = missing\r\n     pass\r\n   \
  \  yield '\\n'\r\n-    l_0_bar = context.vars['bar'] = environment.get_template('bar',\
  \ 'foo').make_module(context.get_all(), True, {'bar': l_0_bar, 'baz': l_0_baz})\r\
  \n+    l_0_bar = context.vars['bar'] = environment.get_template('bar', 'foo').make_module(context.get_all(),\
  \ True, {'baz': l_0_baz, 'bar': l_0_bar})\r\n     context.exported_vars.discard('bar')\r\
  \n     yield '\\n'\r\n-    l_0_baz = context.vars['baz'] = environment.get_template('baz',\
  \ 'foo').make_module(context.get_all(), True, {'bar': l_0_bar, 'baz': l_0_baz})\r\
  \n+    l_0_baz = context.vars['baz'] = environment.get_template('baz', 'foo').make_module(context.get_all(),\
  \ True, {'baz': l_0_baz, 'bar': l_0_bar})\r\n     context.exported_vars.discard('baz')\r\
  \n\r\n blocks = {}\r\n debug_info = '2=13&3=16'\r\n```\r\n\r\nChromium uses jinja2\
  \ for code generator during build, and this breaks [Reproducible builds](https://en.wikipedia.org/wiki/Reproducible_builds)\
  \ when we are switching to python3.\r\n\r\nSome more context is in https://crbug.com/1194274\r\
  \n\r\nEnvironment:\r\n\r\n- Python version: `Python 3.9.2`\r\n- Jinja version: `3.0.1`\n"
