source: mutated
prompt: |
  In the commands list of a group's `--help` output, every command's short
  description is missing the last word of its first sentence. A command whose
  docstring starts with "Sync the database. More details follow." shows up in
  the listing as "Sync the" instead of "Sync the database."

  Running the full `--help` for the individual command shows the complete
  docstring fine; only the condensed one-line summaries in the parent group
  listing are affected. Several of our CLIs render truncated nonsense now.

  Find and fix the bug.
mutation_patch: bug.patch
