prompt: "non-deterministic output from compile templates when using tuple unpacking\n\
  \nIdeally compile_templates will have deterministic output so we can use git diff\
  \ etc\r\n\r\nSee also https://github.com/pallets/jinja/issues/1453 and https://github.com/pallets/jinja/issues/1452\r\
  \n\r\nFound another case where this occurs, e.g. I'm randomly getting these changes\
  \ or their inverse:\r\n\r\n```diff\r\n-    context.vars.update({'triage_reports':\
  \ l_0_triage_reports, 'open_group_index': l_0_open_group_index})\r\n-    context.exported_vars.update(('triage_reports',\
  \ 'open_group_index'))\r\n+    context.vars.update({'open_group_index': l_0_open_group_index,\
  \ 'triage_reports': l_0_triage_reports})\r\n+    context.exported_vars.update(('open_group_index',\
  \ 'triage_reports'))\r\n```\r\nor:\r\n```diff\r\n-                _loop_vars.update({'row_spans':\
  \ l_2_row_spans, 'row': l_2_row})\r\n+                _loop_vars.update({'row':\
  \ l_2_row, 'row_spans': l_2_row_spans})\r\n```\r\n\r\nI can see that both of the\
  \ cases above are a result of using tuple unpacking to set multiple new context\
  \ vars in a single `set` call\r\ne.g.\r\n```jinja\r\n{% set triage_reports, open_group_index\
  \ = get_nav_list_items(TRIAGE_REPORTS_NAV, url_name, url_func=url) %}\r\n```\r\n\
  ```jinja\r\n{% set row, row_spans = row %}\r\n```\r\n\r\n\r\nThe output from compiling\
  \ the templates should be stable if the underlying template hasn't changed, rather\
  \ than varying randomly each time you run it.\r\n\r\nEnvironment:\r\n\r\n- Python\
  \ version: 3.11.5\r\n- Jinja version: 3.1.4\n"
