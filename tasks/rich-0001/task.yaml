prompt: |
  Text containing CJK / double-width characters wraps one column too early.
  A line of wide characters that should exactly fill the available width gets
  broken before the last character, so panels and tables render with a ragged
  right edge and waste a column. Pure-ASCII text wraps correctly.

  Example: wrapping "あ1り234が5と6う78" to width 3 should give
  ["あ1", "り2", "34", "が5", "と6", "う7", "8"] but the first chunk comes out
  as just "あ" and everything after is shifted.

  Find and fix the wrapping bug.
mutation_patch: bug.patch
