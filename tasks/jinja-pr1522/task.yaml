prompt: "Node.__hash__ raises exception on all parsed input\n\nI've looked into a\
  \ regression in https://github.com/pallets/jinja/commit/60293416db69782fd048a7820667afa4ae7c423b\
  \ where the `Node.__hash__` method was changed from using `object.__hash__` to it's\r\
  \nown implementation using `Node.iter_fields()`.\r\n\r\nSince the fields contain\
  \ lists, the resulting tuple is not hashable.\r\n\r\nTest case:\r\n```python\r\n\
  class TestHashing:\r\n    def test_template_hash(self, env):\r\n        template\
  \ = env.parse(\"hash test\")\r\n        assert hash(template)\r\n```\r\nOutput:\r\
  \n```python\r\nself = Template(body=[Output(nodes=[TemplateData(data='hash test')])])\r\
  \n\r\n    def __hash__(self):\r\n>       return hash(tuple(self.iter_fields()))\r\
  \nE       TypeError: unhashable type: 'list'\r\n```\r\n\r\nThis behaviour breaks\
  \ some third party packages such as `django-compressor`. See https://github.com/django-compressor/django-compressor/issues/1060\r\
  \n\r\nEnvironment:\r\n\r\n- Python version: 3.10\r\n- Jinja version: 3.0.x\n"
