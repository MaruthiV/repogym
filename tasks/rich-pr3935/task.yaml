prompt: "[BUG] Table padding is miscalculated in first column\n\n- [x] I've checked\
  \ [docs](https://rich.readthedocs.io/en/latest/introduction.html) and [closed issues](https://github.com/Textualize/rich/issues?q=is%3Aissue+is%3Aclosed)\
  \ for possible solutions.\n- [x] I can't find my issue in the [FAQ](https://github.com/Textualize/rich/blob/master/FAQ.md).\n\
  \n**Table padding is miscalculated in first column**\n\nI'm using a table for layout,\
  \ but the first column has too much padding between it and the second column. When\
  \ I investigated, I found that adjusting the padding also adjusts the margin of\
  \ error, meaning that it's basically putting in double the requested amount of padding,\
  \ but only for the divider between the first and second columns.\n\n**Minimum reproduceable\
  \ code**\n```python\nfrom rich import print\nfrom rich.table import Table\n\ntable\
  \ = Table.grid(padding=(0, 1))\n\nfor _ in range(3):\n    table.add_column(width=3)\n\
  \nfor row in range(3):\n    table.add_row(*[\"a\" * 3 for _ in range(3)])\n\nprint(table)\n\
  ```\n\n<img width=\"232\" height=\"124\" alt=\"Image\" src=\"https://github.com/user-attachments/assets/535a79c7-b470-4392-9ce9-79d76b5e8b22\"\
