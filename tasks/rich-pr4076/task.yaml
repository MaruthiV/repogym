prompt: "[BUG] Trailing line break removed by Text.from_ansi().\n\n- [x] I've checked\
  \ [docs](https://rich.readthedocs.io/en/latest/introduction.html) and [closed issues](https://github.com/Textualize/rich/issues?q=is%3Aissue+is%3Aclosed)\
  \ for possible solutions.\n- [x] I can't find my issue in the [FAQ](https://github.com/Textualize/rich/blob/master/FAQ.md).\n\
  \n**Describe the bug**\n\nIf the string passed to `Text.from_ansi()` ends with a\
  \ newline, it is removed.\n\nSimply put : `Text(\"\\n\") != Text.from_ansi(\"\\\
  n\")`\n\n**Example**\n```Python\nfrom rich.text import Text\n\nprint(Text.from_ansi(\"\
  text\").__repr__())\nprint(Text.from_ansi(\"text\\n\").__repr__())\nprint(Text.from_ansi(\"\
  text\\n\\n\").__repr__())\n```\n\n**Output**\n```Console\n<text 'text' [] ''>\n\
  <text 'text' [] ''>\n<text 'text\\n' [] ''>\n```\n\n**Expected Output**\n```Console\n\
  <text 'text' [] ''>\n<text 'text\\n' [] ''>\n<text 'text\\n\\n' [] ''>\n```\n\n\
