prompt: "ValueError: The 'yourapp' package was not installed in a way that PackageLoader\
  \ understands.\n\nI use the example provided in the documentation at https://jinja.palletsprojects.com/en/3.0.x/api/#basics\r\
  \nThe file `yourapp.py` contains:\r\n```python\r\n#!/usr/bin/env python3\r\n\r\n\
  from jinja2 import Environment, PackageLoader, select_autoescape\r\nenv = Environment(\r\
  \n    loader=PackageLoader(\"yourapp\"),\r\n    autoescape=select_autoescape()\r\
  \n)\r\n```\r\n\r\nI get:\r\n```\r\n$ python3 yourapp.py \r\nTraceback (most recent\
  \ call last):\r\n  File \"/private/tmp/test/yourapp.py\", line 5, in <module>\r\n\
  \    loader=PackageLoader(\"yourapp\"),\r\n  File \"/usr/local/lib/python3.9/site-packages/jinja2/loaders.py\"\
  , line 287, in __init__\r\n    import_module(package_name)\r\n  File \"/usr/local/Cellar/python@3.9/3.9.7/Frameworks/Python.framework/Versions/3.9/lib/python3.9/importlib/__init__.py\"\
  , line 127, in import_module\r\n    return _bootstrap._gcd_import(name[level:],\
  \ package, level)\r\n  File \"<frozen importlib._bootstrap>\", line 1030, in _gcd_import\r\
  \n  File \"<frozen importlib._bootstrap>\", line 1007, in _find_and_load\r\n  File\
  \ \"<frozen importlib._bootstrap>\", line 986, in _find_and_load_unlocked\r\n  File\
  \ \"<frozen importlib._bootstrap>\", line 680, in _load_unlocked\r\n  File \"<frozen\
  \ importlib._bootstrap_external>\", line 850, in exec_module\r\n  File \"<frozen\
  \ importlib._bootstrap>\", line 228, in _call_with_frames_removed\r\n  File \"/private/tmp/test/yourapp.py\"\
  , line 5, in <module>\r\n    loader=PackageLoader(\"yourapp\"),\r\n  File \"/usr/local/lib/python3.9/site-packages/jinja2/loaders.py\"\
  , line 311, in __init__\r\n    raise ValueError(\r\nValueError: The 'yourapp' package\
  \ was not installed in a way that PackageLoader understands.\r\n```\r\n\r\nThe problem\
  \ looks like because `yourapp.py` is **not** a package but just a (simple) Python\
  \ script.\r\nIn this case `spec.submodule_search_locations` is None.\r\n```python\r\
  \n$ python3\r\nPython 3.9.7 (default, Sep  3 2021, 12:37:55) \r\n[Clang 12.0.5 (clang-1205.0.22.9)]\
  \ on darwin\r\nType \"help\", \"copyright\", \"credits\" or \"license\" for more\
  \ information.\r\n>>> import importlib.util\r\n>>> package_name='yourapp'\r\n>>>\
  \ spec = importlib.util.find_spec(package_name)\r\n>>> print(spec.submodule_search_locations)\r\
  \nNone\r\n```\r\n\r\nMaybe the loader could search in the current directory?\r\n\
  The same code was working fine with version 2.11.2 of Jinja2 for example.\r\n\r\n\
  I found related issues in https://github.com/pallets/jinja/issues/1148 and https://github.com/pallets/jinja/issues/1168\
  \ but I could not find a (simple) solution to my problem.\r\n\r\nProposed patch:\r\
  \n```patch\r\n--- loaders.py.orig\t2021-10-13 21:20:16.000000000 +0200\r\n+++ loaders.py\t\
  2021-10-13 21:21:04.000000000 +0200\r\n@@ -306,6 +306,8 @@\r\n                 if\
  \ os.path.isdir(root):\r\n                     template_root = root\r\n        \
  \             break\r\n+        else:\r\n+            template_root = 'templates'\r\
  \n \r\n         if template_root is None:\r\n             raise ValueError(\r\n\
  ```\r\nThis patch works for me.\r\n\r\nEnvironment:\r\n\r\n- Python version: 3.9.7\r\
  \n- Jinja version: 3.0.2\n"
