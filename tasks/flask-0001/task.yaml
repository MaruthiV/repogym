language: python
category: bug_fix
level: L2
source: mutated
prompt: |
  Setting up an app as `Flask("wsgiapp")` from a launcher script (where the module
  `wsgiapp.py` has not been imported yet) breaks template and static file resolution.
  `render_template("index.html")` raises TemplateNotFound even though a `templates/`
  directory sits right next to `wsgiapp.py`, and static assets 404.

  Printing `app.root_path` shows it points at the module FILE itself
  (`.../wsgiapp.py`) instead of the containing directory. If I import `wsgiapp`
  before constructing the Flask app, everything works fine.

  Fix the root path resolution so unimported module names behave the same as
  imported ones. Please fix the underlying bug in flask itself, not a workaround.
mutation_patch: bug.patch
