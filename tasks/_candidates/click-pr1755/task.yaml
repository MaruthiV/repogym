prompt: "Custom default label ignored if default is None\n\nI found out that custom\
  \ default label is not shown when `default` is `None`. In some cases `default =\
  \ None` is intentional, but custom default label would be still helpful.\r\n\r\n\
  An example with `--limit` option, with `None` as `default` meaning no limit:\r\n\
  ```python\r\nimport click\r\n\r\n@click.command()\r\n@click.option('--limit', type=int,\
  \ show_default='unlimited')\r\ndef main(limit: int):\r\n    print('Limit: {}'.format(limit))\r\
  \n\r\nif __name__ == '__main__':\r\n    main()\r\n```\r\n\r\n### Expected Behavior\r\
  \nTell us what should happen.\r\n\r\n```sh\r\n$ python3 /tmp/foo.py --help\r\nUsage:\
  \ foo.py [OPTIONS]\r\n\r\nOptions:\r\n  --limit INTEGER  [default: unlimited]\r\n\
  \  --help           Show this message and exit.\r\n```\r\n\r\n### Actual Behavior\r\
  \nTell us what happens instead.\r\n\r\n```sh\r\n$ python3 /tmp/foo.py --help\r\n\
  Usage: foo.py [OPTIONS]\r\n\r\nOptions:\r\n  --limit INTEGER\r\n  --help       \
  \    Show this message and exit.\r\n```\r\nDefault is not shown, making the description\
  \ less useful.\r\n\r\n### Environment\r\n\r\n* Python version: 3.9.1\r\n* Click\
  \ version: 7.1.2\n"
