prompt: "Shell completion fails for option values that start with symbols\n\nRunning\
  \ into the same case as #1929, except specific to option values that may start with\
  \ symbols such as '+', '~', and '!'. Shell completion treats these values as the\
  \ start of new options, so doesn't complete them.\r\n\r\nReproduction script with\
  \ the cli command referenced by setuptools:\r\n\r\n```python\r\n@command()\r\n@option(\"\
  -c\", type=Choice([\"+1\", \"+2\", \"!1\", \"!2\"]))\r\ndef cli(c):\r\n    echo(f\"\
  Value is {c}\")\r\n```\r\n\r\nWith shell completion enabled:\r\n\r\n```sh\r\n$ click-bug\
  \ -c <TAB><TAB>\r\n+1 +2  !1 !2\r\n$ click-bug -c +<TAB><TAB>\r\n# Nothing happens\r\
  \n```\r\n\r\nI was looking at the discussion on #1930, and it makes sense that '+'\
  \ may be considered the start of an option. I'm wondering if it would be valid for\
  \ completion to prioritize option values over new option names. As in, within shell_completion.py's\
  \ _resolve_incomplete function, moving the `_is_incomplete_option` check above the\
  \ `if \"--\" not in args and _start_of_option(incomplete)` call allows the tab completion\
  \ in this example to work as expected:\r\n\r\n```sh\r\n$ click-bug -c +<TAB><TAB>\r\
  \n+1 +2\r\n```\r\n\r\nI can look into putting up a PR to do that if it seems valid.\r\
  \n\r\nEnvironment:\r\n\r\n- Python version: 3.6.9\r\n- Click version: 8.0.1\n"
