prompt: "@pass_meta_key decorator\n\n### Idea Proposal:\r\n\r\nAs a click's plugin\
  \ developer, we use the `click.Context.meta` dictionary to store any state. So IMHO,\
  \ click could provide another decorator: `@click.pass_metavar(key=\"foo\")` similar\
  \ to `@click.pass_obj`.\r\n\r\n**Example implementation:**\r\n\r\n```python\r\n\
  def pass_metavar(key: str):\r\n    \"\"\"Similar to :func:`click.pass_obj`,\r\n\
  \    this passes the ctx.meta[key] variable instead as the first argument.\r\n \
  \   \"\"\"\r\n\r\n    def decorator(f):\r\n            @click.pass_context\r\n \
  \           def new_func(ctx: click.Context, *args, **kwargs):\r\n             \
  \   var = ctx.meta[key]\r\n                return ctx.invoke(f, var, *args, **kwargs)\r\
  \n\r\n        return update_wrapper(new_func, f)\r\n    \r\n    return decorator\r\
  \n```\r\n\r\n**Example usage:**\r\n\r\n```python\r\n@click.pass_metavar(key=\"foo\"\
  )\r\ndef bar(var):\r\n    click.echo(var)\r\n```\r\n\r\nI think this would be beneficial\
  \ for click's plugin developers and naturally anyone building a complex CLI app\
  \ which requires using the `click.Context.meta` to store state. \r\n\r\nIf you like\
  \ the idea, I will be glad to raise a PR for it asap.\n"
