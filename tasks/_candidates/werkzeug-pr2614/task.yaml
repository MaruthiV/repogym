prompt: "parse_options_header quote handling\n\nI wrote a new version of cgi.parse_header\
  \ / werkzeug.parse_options_header with better handling for various special cases\
  \ that unfortunately occur. The new implementation is also twice faster than the\
  \ two others.\r\n\r\n````python\r\nimport re\r\nimport typing\r\n\r\nOptions = typing.Dict[str,\
  \ str]  # key=value fields in various headers\r\n\r\ntoken, quoted = r\"([\\w!#$%&'*+\\\
  -.^_`|~]+)\", r'\"([^\"]*)\"'\r\nparameter = re.compile(fr\";\\s*{token}=(?:{token}|{quoted})\"\
  , re.ASCII)\r\nfirefox_quote_escape = re.compile(r'\\\\\"(?!; |\\s*$)')\r\n\r\n\
  # RFC's quoted-pair escapes are mostly ignored by browsers. Chrome, Firefox and\r\
  \n# curl all have different escaping, that we try to handle as well as possible,\r\
  \n# even though no client espaces in a way that would allow perfect handling.\r\n\
  \r\ndef parse_content_header(value: str) -> typing.Tuple[str, Options]:\r\n    \"\
  \"\"Parse content-type and content-disposition header values.\r\n\r\n    E.g. 'form-data;\
  \ name=upload; filename=\\\"file.txt\\\"' to\r\n    ('form-data', {'name': 'upload',\
  \ 'filename': 'file.txt'})\r\n\r\n    Mostly identical to cgi.parse_header and werkzeug.parse_options_header\r\
  \n    but runs faster and handles special characters better. Unescapes quotes.\r\
  \n    \"\"\"\r\n    value = firefox_quote_escape.sub(\"%22\", value)\r\n    pos\
  \ = value.find(\";\")\r\n    if pos == -1:\r\n        options = {}\r\n    else:\r\
  \n        options = {\r\n            m.group(1).lower(): m.group(2) or m.group(3).replace(\"\
  %22\", '\"')\r\n            for m in parameter.finditer(value[pos:])\r\n       \
  \ }\r\n        value = value[:pos]\r\n    return value.strip().lower(), options\r\
  \n````\r\n\r\nThis does not support werkzeug.parse_options_header's multiple=True,\
  \ which I didn't see being used anywhere anyway (is that for accept-header or what?).\
  \ This is written for Sanic, but if anyone cares to port it to Werkzeug, the code\
  \ is there (sorry -- don't have time to do it myself). Adding support for multiple=True\
  \ is a few lines of code (with proper handling of quoted commas), if deemed useful.\r\
  \n\r\nCPython cgi.parse_header tests as well as two others that I added based on\
  \ testing real browsers all pass with this:\r\n\r\n````python\r\nimport pytest\r\
  \n\r\nfrom sanic import headers\r\n\r\n\r\n@pytest.mark.parametrize(\r\n    \"input,\
  \ expected\",\r\n    [\r\n        (\"text/plain\", (\"text/plain\", {})),\r\n  \
  \      (\"text/vnd.just.made.this.up ; \", (\"text/vnd.just.made.this.up\", {})),\r\
  \n        (\"text/plain;charset=us-ascii\", (\"text/plain\", {\"charset\": \"us-ascii\"\
  })),\r\n        ('text/plain ; charset=\"us-ascii\"', (\"text/plain\", {\"charset\"\
  : \"us-ascii\"})),\r\n        (\r\n            'text/plain ; charset=\"us-ascii\"\
  ; another=opt',\r\n            (\"text/plain\", {\"charset\": \"us-ascii\", \"another\"\
  : \"opt\"})\r\n        ),\r\n        (\r\n            'attachment; filename=\"silly.txt\"\
  ',\r\n            (\"attachment\", {\"filename\": \"silly.txt\"})\r\n        ),\r\
  \n        (\r\n            'attachment; filename=\"strange;name\"',\r\n        \
  \    (\"attachment\", {\"filename\": \"strange;name\"})\r\n        ),\r\n      \
  \  (\r\n            'attachment; filename=\"strange;name\";size=123;',\r\n     \
  \       (\"attachment\", {\"filename\": \"strange;name\", \"size\": \"123\"})\r\n\
  \        ),\r\n        (\r\n            'form-data; name=\"files\"; filename=\"\
  fo\\\\\"o;bar\\\\\"',\r\n            ('form-data', {'name': 'files', 'filename':\
  \ 'fo\"o;bar\\\\'})\r\n            # cgi.parse_header:\r\n            # ('form-data',\
  \ {'name': 'files', 'filename': 'fo\"o;bar\\\\'})\r\n            # werkzeug.parse_options_header:\r\
  \n            # ('form-data', {'name': 'files', 'filename': '\"fo\\\\\"o', 'bar\\\
  \\\"': None})\r\n        ),\r\n        # <input type=file name=\"foo&quot;;bar\\\
  \"> with Unicode filename!\r\n        (\r\n            # Chrome:\r\n           \
  \ # Content-Disposition: form-data; name=\"foo%22;bar\\\"; filename=\"\U0001F600\
  \"\r\n            'form-data; name=\"foo%22;bar\\\\\"; filename=\"\U0001F600\"',\r\
  \n            ('form-data', {'name': 'foo\";bar\\\\', 'filename': '\U0001F600'})\r\
  \n            # cgi: ('form-data', {'name': 'foo%22;bar\"; filename=\"\U0001F600\
  '})\r\n            # werkzeug: ('form-data', {'name': 'foo%22;bar\"; filename='})\r\
  \n        ),\r\n        (\r\n            # Firefox:\r\n            # Content-D\n"
