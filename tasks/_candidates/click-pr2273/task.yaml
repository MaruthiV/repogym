prompt: "`ctx.color` is ignored in `ClickException.show()`\n\nI have tried to set\
  \ `ctx.color = True` as suggested in #1090 in order to enable colour output in Gitlab\
  \ CI. This worked out great for normal `click.secho` but unfortunately it does not\
  \ work for output generated via raising `ClickException` subclass. Essentially the\
  \ `echo` inside `ClickException.show()` ignores `ctx.color`.\r\n\r\nAfter some digging,\
  \ I am almost sure this is because the `get_current_context` returns `None`, there\
  \ is no context when exceptions are handled:\r\nhttps://github.com/pallets/click/blob/49164faca678dd476f1b11a2584fd0e1c6be70b2/src/click/globals.py#L63\r\
  \n\r\n## Test code\r\n```python\r\nimport click\r\nfrom click import ClickException\r\
  \n\r\n\r\nclass CLIError(ClickException):\r\n    def format_message(self) -> str:\r\
  \n        return click.style(self.message, fg='red')\r\n\r\n\r\n@click.command()\r\
  \n@click.option('--ansi', is_flag=True)\r\n@click.pass_context\r\ndef cli(ctx, ansi):\r\
  \n    if ansi:\r\n        ctx.color = True\r\n\r\n    click.secho('some output',\
  \ fg='green')\r\n\r\n    raise CLIError('some error')\r\n\r\n\r\nif __name__ ==\
  \ '__main__':\r\n    cli()\r\n```\r\n\r\n## Test cases\r\n1. `python test.py`\r\n\
  2. `python test.py --ansi`\r\n3. `python test.py &> test.log; cat test.log`\r\n\
  4. `python test.py --ansi &> test.log; cat test.log`\r\n\r\n## Expected behaviour\r\
  \nIn all cases except 3) there is a green `some output` and red `some error` in\
  \ output.\r\n\r\nIn 3) there is no colouring.\r\n\r\n## Actual behaviour\r\nEverything\
  \ is as expected except 4) where `some error` is not coloured.\r\n\r\n## Environment\r\
  \n- Python version: 3.7.9\r\n- Click version: 8.0.3\n"
