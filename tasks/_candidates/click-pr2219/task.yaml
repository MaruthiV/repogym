prompt: "`ParamType` missing `name` errors on `to_info_dict`\n\nWhen calling `to_info_dict`\
  \ on a `ParamType` instance which doesn't have a `name` attribute, an exception\
  \ is raised. While this is a bug in the downstream code, only `to_info_dict` is\
  \ affected, so the bug often goes unnoticed.\r\n\r\n```py3\r\nclass TestType(click.ParamType):\r\
  \n    pass\r\n\r\nTestType().to_info_dict()\r\n```\r\n\r\n```\r\n>       return\
  \ {\"param_type\": param_type, \"name\": self.name}\r\nE       AttributeError: 'TestType'\
  \ object has no attribute 'name'\r\n\r\nsrc/click/types.py:66: AttributeError\r\n\
  ```\r\n\r\nIt would be nice to have some sort of reasonable fallback. I've put coded\
  \ such possibility at https://github.com/pallets/click/compare/main...phy1729:fix-ParamType-no-name\
  \ . I also fixed where the docs neglected to specify `name` in an example.\r\n\r\
  \nEnvironment:\r\n\r\n- Python version: Python 3.9.9\r\n- Click version: 8.0.3\n"
