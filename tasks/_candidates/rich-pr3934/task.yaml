prompt: '[BUG] Live with empty render leaves behind a spurious newline


  - [x] I''ve checked [docs](https://rich.readthedocs.io/en/latest/introduction.html)
  and [closed issues](https://github.com/Textualize/rich/issues?q=is%3Aissue+is%3Aclosed)
  for possible solutions.

  - [x] I can''t find my issue in the [FAQ](https://github.com/Textualize/rich/blob/master/FAQ.md).


  **Describe the bug**


  When using a `Live` without anything that renders, it will leave behind a spurious
  newline despite setting `transient=True`. However, even a single empty string makes
  the newline go away.


  ```python

  from rich.live import Live

  from rich.console import Group


  list: list[RenderableType] = []

  live = Live(Group(*list), transient=True)

  with live: pass

  exit(0)

  ```


  The code above will leave behind a spurious newline (see screenshot). If I were
  to initialize `list` as `[""]`, the newline does not appear anymore.


  <img width="582" height="88" alt="Image" src="https://github.com/user-attachments/assets/4d5b8327-db25-4da4-87eb-ebe65b30d8c9"
  />


  Some more details on the usecase: I use a live to render a varying number of elements
  indicating progress - once the task is done, the associated elements will go away
  as well. Consequently, at the end of my program, the list of renderables in the
  group is empty, and my code leaves behind a spurious newline. Always having the
  empty string as a "hack" is slightly annoying as well, since then during the Live
  display, there is always an additional empty line at the bottom of the screen -
  limiting the real estate.


