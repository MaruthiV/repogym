prompt: "Can't set the default value for multiple options with optional values\n\n\
  The following example combines [optional values](https://click.palletsprojects.com/en/8.0.x/options/#optional-value)\
  \ with [multiple options](https://click.palletsprojects.com/en/8.0.x/options/#multiple-options):\r\
  \n\r\n```python\r\n#!/usr/bin/env python3\r\n\r\nimport click\r\n\r\n\r\n@click.command()\r\
  \n@click.option('--label', multiple=True, is_flag=False, flag_value='default')\r\
  \ndef cli(label):\r\n    print(label)\r\n    print(f\"click.core._flag_needs_value:\
  \ {click.core._flag_needs_value}\")\r\n\r\n\r\ncli()\r\n```\r\n\r\n```\r\n$ ./test.py\
  \ --label --label test\r\n('<object object at 0x7f5ef63ec250>', 'test')\r\nclick.core._flag_needs_value:\
  \ <object object at 0x7f5ef63ec250>\r\n```\r\n\r\n\r\n\r\nExpected result: `('default',\
  \ 'test')`\r\n\r\nLooks like when `multiple=True`, the sentinel value (`click.core._flag_needs_value`)\
  \ is never substituted with the default value specified by `flag_value`.\r\n\r\n\
  Environment:\r\n\r\n- Python version: 3.7.3\r\n- Click version: 8.0.1\n"
