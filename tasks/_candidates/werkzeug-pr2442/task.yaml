prompt: "multipart disposition parameter parser is case-sensitive in violation of\
  \ RFC6266\n\nI was trying to implement a file uploader for a very-legacy system\
  \ that is using a `content-disposition: form-data; name=\"message\"; fileName=\"\
  sample.txt\"` header in multipart/form-data uploads.\r\n\r\nFlask/werkzeug/sansio\
  \ is [only looking for a `filename` extra](https://github.com/pallets/werkzeug/blob/main/src/werkzeug/sansio/multipart.py#L167),\
  \ so it misses the `fileName` extra.\r\n\r\nTherefore, the files are misdetected\
  \ as fields instead of as files.\r\n\r\nHowever, [RFC6266 §4.3](https://datatracker.ietf.org/doc/html/rfc6266#section-4.3)\
  \ says that\r\n\r\n> The parameters \"filename\" and \"filename*\", to be matched\
  \ case-insensitively, provide information on how to construct a filename for storing\
  \ the message payload.\r\n\r\nMinimal example:\r\n\r\n```py\r\nfrom flask import\
  \ Flask, request, make_response\r\n\r\napp = Flask(__name__)\r\n\r\n@app.route('/',methods\
  \ = ['POST', 'GET'])\r\ndef sendmail():\r\n    if request.method == 'POST':\r\n\
  \        print('files', request.files)\r\n        print('form', request.form)\r\n\
  \        return make_response(\"Yay\", 201)\r\n    return make_response(\"Nay\"\
  , 200)\r\n\r\nif __name__ == '__main__':\r\n    app.run(debug = True)\r\n```\r\n\
  \r\nPayload to trigger the issue:\r\n```http\r\nPOST / HTTP/1.0\r\nContent-Type:\
  \ multipart/form-data; boundary=---------------------------7d93b9550d4a\r\nAccept:\
  \ image/gif, image/x-xbitmap, image/jpeg, image/pjpeg, application/x-shockwave-flash,\
  \ application/vnd.ms-excel, application/vnd.ms-powerpoint, application/msword, */*\r\
  \nContent-Length: 350\r\n\r\n-----------------------------7d93b9550d4a\r\ncontent-disposition:\
  \ form-data; name=\"message\"; fileName=\"sample.txt\"\r\ncontent-Type: multipart/form-data;\r\
  \n\r\nmessage\r\n\r\n-----------------------------7d93b9550d4a\r\ncontent-disposition:\
  \ form-data; name=\"binary\"; fileName=\"none.jpg\"\r\ncontent-Type: image/jpeg;\r\
  \n\r\n\r\n-----------------------------7d93b9550d4a--\r\n\r\n```\r\n\r\nSave the\
  \ above into request.http and run to test:\r\n```\r\nnc 127.0.0.1 5000 < request.http\r\
  \n```\r\n\r\nExpected output: request.files has two elements, \"message\" and \"\
  binary\"\r\n\r\nActual output: request.form has two elements, \"message\" and \"\
  binary\", request.files has none\r\n\r\n\r\nEnvironment:\r\n\r\n- Python version:\
  \ 3.9.10\r\n- Werkzeug version: 2.1.2\r\n\r\nP.S: the legacy system I'm using fails\
  \ to submit an epilogue, instead sending a regular boundary (I've fixed that in\
  \ the above example), causing the parsing to [fail with a ValueError](https://github.com/pallets/werkzeug/blob/main/src/werkzeug/sansio/multipart.py#L212-L213)\
  \ which is however silently ignored somewhere upstack, resulting in a \"successful\"\
  \ parsing of the form that has neither form fields nor files on it. I'm not sure\
  \ if this silent ignoring of a form error should be reported as a separate bug.\n"
