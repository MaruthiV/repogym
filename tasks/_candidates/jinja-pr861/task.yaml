prompt: "Enable access to local variables in extensions\n\nAs far as I can tell, there\
  \ is no way for extensions to access local variables from their call site, they\
  \ can only access the template context (which, for example, excludes loop-local\
  \ variables).\r\n\r\n## Template Code\r\n\r\nUsing the extension at https://review.openstack.org/#/c/568021/5/jenkins_jobs/jinja2_extension.py,\
  \ and\r\n\r\n```jinja\r\n{% set y = 'foo' %}\r\n{% for x in [1, 2] %}\r\n    {%\
  \ set z = 'bar' %}\r\n    {% for a in [1, 2] %}\r\n        {% jjb_include_raw 'jinja_jjb_include_raw001.sh.inc'\
  \ %}\r\n    {% endfor %}\r\n{% endfor %}\r\n```\r\nthe `context` passed by a ContextReference\
  \ in `_render_template` looks like:\r\n\r\n```py\r\n>>> context\r\n<Context {'range':\
  \ <class 'range'>, 'dict': <class 'dict'>, 'lipsum': <function generate_lorem_ipsum\
  \ at 0x7fb8d23a0840>, 'cycler': <class 'jinja2.utils.Cycler'>, 'joiner': <class\
  \ 'jinja2.utils.Joiner'>, 'namespace': <class 'jinja2.utils.Namespace'>, 'name':\
  \ 'test-include_jjb', 'param': 'value', 'template-name': 'test-job-{param}', '':\
  \ '', 'builders': [OrderedDict([('shell', <jenkins_jobs.local_yaml.Jinja2Loader\
  \ object at 0x7fb8d5e09198>)])], 'y': 'foo'} of None>\r\n>>> pprint.pprint(dict(context))\r\
  \n{'': '',\r\n 'builders': [OrderedDict([('shell',\r\n                         \
  \   <jenkins_jobs.local_yaml.Jinja2Loader object at 0x7fb8d5e09198>)])],\r\n 'cycler':\
  \ <class 'jinja2.utils.Cycler'>,\r\n 'dict': <class 'dict'>,\r\n 'joiner': <class\
  \ 'jinja2.utils.Joiner'>,\r\n 'lipsum': <function generate_lorem_ipsum at 0x7fb8d23a0840>,\r\
  \n 'name': 'test-include_jjb',\r\n 'namespace': <class 'jinja2.utils.Namespace'>,\r\
  \n 'param': 'value',\r\n 'range': <class 'range'>,\r\n 'template-name': 'test-job-{param}',\r\
  \n 'y': 'foo'}\r\n\r\n```\r\n\r\nNote that `y` is in the context, but none of `x`,\
  \ `z` or `a` are.\r\n\r\n## Your Environment\r\n* Python version: 3.6\r\n* Jinja\
  \ version: trunk\n"
