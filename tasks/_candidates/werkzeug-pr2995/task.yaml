prompt: "MultiDict converts byte values to int list since version 3.1.0\n\nSince version\
  \ 3.1.0, when I create a MultiDict with a bytes value as input it stores the bytes\
  \ value in the MultiDict as a list of integer values. Prior to 3.1.0, this would\
  \ preserve the bytes value in the MultiDict.\r\n\r\nTo reproduce, run this snippet\
  \ with werkzeug installed:\r\n```python\r\nfrom werkzeug.datastructures import MultiDict\r\
  \n\r\nmulti_dict = MultiDict({\r\n    'bytes_value': b'abc',\r\n    'str_value':\
  \ 'abc'\r\n})\r\n\r\nprint(multi_dict)\r\n```\r\n\r\nRunning the above on version\
  \ 3.1.0 prints:\r\n`MultiDict([('bytes_value', 97), ('bytes_value', 98), ('bytes_value',\
  \ 99), ('str_value', 'abc')])`\r\n\r\nRunning the snippet with version 3.0.6 prints:\r\
  \n`MultiDict([('bytes_value', b'abc'), ('str_value', 'abc')])`\r\n\r\nI expected\
  \ the behaviour from 3.0.6 to be preserved in this case\r\n\r\nEnvironment:\r\n\
  - Python version: 3.11\r\n- Werkzeug version: >= 3.1.0\n"
