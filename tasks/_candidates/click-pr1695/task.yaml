prompt: "Automatic short help should also take linebreak into account\n\nPEP257 defines\
  \ a summary line for [multi-line docstrings](https://www.python.org/dev/peps/pep-0257/#multi-line-docstrings)\
  \ just like a [one-line docstring](https://www.python.org/dev/peps/pep-0257/#one-line-docstrings)\
  \ to be a phrase ending in a period.\r\n\r\nClick automatically uses everything\
  \ up to the first period to be the short help, independent how many lines it spans.\r\
  \n\r\nConsider the following:\r\n```\r\nimport click\r\n\r\n@click.group()\r\ndef\
  \ grp():\r\n    pass\r\n\r\n@grp.command()\r\ndef cmd1():\r\n    \"\"\"First sentence.\
  \ Second sentence.\"\"\"\r\n\r\n@grp.command()\r\ndef cmd2():\r\n    \"\"\"Summary\
  \ line without a period\r\n   \r\n    First real sentence. Another sentence.\r\n\
  \    \"\"\"\r\n```\r\n```\r\n$ python3 foo.py  --help\r\nUsage: foo.py [OPTIONS]\
  \ COMMAND [ARGS]...\r\n\r\nOptions:\r\n  --help  Show this message and exit.\r\n\
  \r\nCommands:\r\n  cmd1  First sentence.\r\n  cmd2  Summary line without a period\
  \ First real...\r\n```\r\nTo me it would feel more natural:\r\n1. to take the first\
  \ line as short help, independent of punctuation OR\r\n1. to look for an ending\
  \ of a phrase or linebreak, whichever comes first.\r\n\r\nBoth would allow for summary\
  \ lines without the requirement to end in a period. While this would violate PEP257,\
  \ I would consider it a gray area, as that summary line is used as short help in\
  \ a list of commands and I have a use case where a company style guide requires\
  \ such lists **not** to end in periods.\r\n\r\nI'd be happy to provide a pull request\
  \ for either solution, if it would be accepted.\n"
