prompt: "8.0.2 doesn't validate paths correctly\n\nPath arguments with a directory\
  \ fail validation with \"file not exists\", despite existing, when resolve_path=True\
  \ is specified\r\n\r\nIt looks like the code here concats the passed-in-path to\
  \ its resolved directory, which means if the path contains a directory, the directory\
  \ part gets duplicated\r\n\r\nhttps://github.com/pallets/click/blob/0a81393fdf41edb0ab9d2f527eccdc8ce38d7d42/src/click/types.py#L852\r\
  \n\r\ne.g.\r\n\r\n```$ mkdir relative-dir\r\n$ touch relative-dir/myfile\r\n$ python3\r\
  \nPython 3.9.7 (default, Sep 28 2021, 18:41:28)\r\n[GCC 10.2.1 20210110] on linux\r\
  \nType \"help\", \"copyright\", \"credits\" or \"license\" for more information.\r\
  \n>>> from click import Path\r\n>>> p = Path(dir_okay=False, exists=True, writable=False,\
  \ resolve_path=True)\r\n>>> p.convert(\"relative-dir/myfile\", None, None)\r\nTraceback\
  \ (most recent call last):\r\n  File \"/usr/local/lib/python3.9/site-packages/click/types.py\"\
  , line 855, in convert\r\n    st = os.stat(rv)\r\nFileNotFoundError: [Errno 2] No\
  \ such file or directory: '/relative-dir/relative-dir/myfile'\r\n\r\nDuring handling\
  \ of the above exception, another exception occurred:\r\n\r\nTraceback (most recent\
  \ call last):\r\n  File \"<stdin>\", line 1, in <module>\r\n  File \"/usr/local/lib/python3.9/site-packages/click/types.py\"\
  , line 859, in convert\r\n    self.fail(\r\n  File \"/usr/local/lib/python3.9/site-packages/click/types.py\"\
  , line 128, in fail\r\n    raise BadParameter(message, ctx=ctx, param=param)\r\n\
  click.exceptions.BadParameter: File 'relative-dir/myfile' does not exist.\r\n```\r\
  \n\r\n\r\n\r\n\r\nEnvironment:\r\n\r\n- Python version: 3.9.7\r\n- Click version:\
  \ 8.0.2\n"
