prompt: "Adding the same route twice will silently fail, should raise an exception\
  \ instead\n\nFlask does not warn about adding the same route twice. It will continue\
  \ to use the view function from the first registration and just silently fail on\
  \ a second registration.\n\nDesired behavior:\nSimilar to adding the same endpoint\
  \ twice, some exception should be raised.\n\n```python\nimport flask\n\napp = flask.Flask(__name__)\n\
  \n@app.route(\"/test\")\ndef myfunc1():\n    return \"myfunc1\"\n\n@app.route(\"\
  /test\") # This should raise an exception\ndef myfunc2():\n    return \"myfunc2\"\
  \n\napp.add_url_rule(\"/test\", \"my test endpoint\", lambda: \"myfunc3\") # This,\
  \ too\n\ncli = app.test_client()\nresponse = cli.get(\"/test\")\ndata = response.get_data(True)\n\
  print(data) # Prints \"myfunc1\"\n```\n\nEnvironment:\n\n- Python version: 3.13.2\n\
  - Flask version: 3.1.0\n"
