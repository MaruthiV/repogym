prompt: "Spurious empty lines in the help output (regression)\n\nClick since version\
  \ 8.1.0 doesn't properly account for a scenario that the callback's docstring can\
  \ have no \"help text\" part, like so:\r\n\r\n```python\r\n@click.command()\r\n\
  def callback():\r\n    \"\"\"\r\n    \\f\r\n    More stuff.\r\n    \"\"\"\r\n```\r\
  \nThis results in empty lines in the output:\r\n\r\n```\r\n% python3 test --help\r\
  \nUsage: test [OPTIONS]\r\n\r\n\r\n\r\nOptions:\r\n  --help  Show this message and\
  \ exit.\r\n```\r\n\r\nBefore 8.1.0:\r\n```\r\n% python3 test --help\r\nUsage: test\
  \ [OPTIONS]\r\n\r\nOptions:\r\n  --help  Show this message and exit.\r\n```\r\n\r\
  \nEnvironment:\r\n\r\n- Python version: 3.9.2\r\n- Click version: 8.1.3\n"
