prompt: "Option.is_bool_flag is set to True even if the option is not a flag\n\nThis\
  \ is relevant only for Click 8.0.1, since the following line was introduced in PR\
  \ https://github.com/pallets/click/pull/1913:\r\n\r\nhttps://github.com/pallets/click/blob/af0af571cbbd921d3974a0ff9cf58a4b26bb852b/src/click/core.py#L2531\r\
  \n\r\nThe solution is as easy as:\r\n\r\n```python\r\nself.is_bool_flag = self.is_flag\
  \ and isinstance(self.type, types.BoolParamType)\r\n```\r\nAvailable to open a PR.\r\
  \n\r\n## Demonstration code\r\n```python\r\nimport click\r\n\r\n@click.command()\r\
  \n@click.option('--switch', type=bool)\r\ndef f(switch):\r\n    print(switch)\r\n\
  \r\n\r\nif __name__ == '__main__':\r\n    assert not f.params[0].is_flag\r\n   \
  \ assert f.params[0].is_bool_flag\r\n    f('--switch'.split())\r\n```\r\n```\r\n\
  Error: Option '--switch' requires an argument.\r\n```\n"
