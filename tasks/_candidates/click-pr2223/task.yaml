prompt: "Inconsistent handling of option values from environment variables\n\nThere\
  \ are 2 ways of configuring Click to load a value of a specific option from an environment\
  \ variable: \"automatic\" via `auto_envvar_prefix` and \"explicit\" via passing\
  \ `envvar` keyword argument to the option definition.\r\n\r\nWhen a name of an environment\
  \ variable is set explicitly, Click treats empty string values (i.e. `export MY_OPTION=`)\
  \ as not set and keeps a default value (`None` if not configured otherwise). But\
  \ when a name is inferred from `auto_envvar_prefix` configuration, Click treats\
  \ empty string values as valid values, does not set a default and passes the option\
  \ to `ParamType.convert()` if `type` keyword argument is specified for that option.\r\
  \n\r\nThis is inconsistent.\r\n\r\n```python\r\nimport click\r\n\r\n@click.command()\r\
  \n@click.option('--auto')\r\n@click.option('--ex', envvar=\"EXEV\")\r\ndef cli(auto,\
  \ ex):\r\n    click.echo(f\"{auto=} {type(auto)=}\")\r\n    click.echo(f\"{ex=}\
  \ {type(ex)=}\")\r\n\r\nif __name__ == '__main__':\r\n    cli(auto_envvar_prefix='MY')\r\
  \n```\r\n\r\nActual output:\r\n\r\n```shell\r\n$ MY_AUTO= EXEV= ./cli.py\r\nauto=''\
  \ type(auto)=<class 'str'>\r\nex=None type(ex)=<class 'NoneType'>\r\n```\r\n\r\n\
  Expected output:\r\n\r\n```shell\r\n$ MY_AUTO= EXEV= ./cli.py\r\nauto=None type(auto)=<class\
  \ 'NoneType'>\r\nex=None type(ex)=<class 'NoneType'>\r\n```\r\n\r\nEnvironment:\r\
  \n\r\n- Python version: `3.9.7`\r\n- Click version: `8.0.3`\r\n\r\nIt's being a\
  \ nuisance for quite a while at my company, we have `.env.example` file with variables\
  \ containing multiple `export FOO=` lines for each project. When my colleagues work\
  \ on the project, they just copy `.env.example` to `.env`, fill out required values\
  \ (not all of the values) and then do a test run.\r\n\r\nThen for variables like\
  \ export `OPTIONAL_VALUE=` that are left as is, click loads them as empty strings\
  \ and calls type validators `TypeInstance.convert()` with that value, which usually\
  \ fails as an empty string is not a valid value for the majority of options.\r\n\
  \r\nNow when I go diving into the code base, it seems like it's handled \"correctly\"\
  \ here:\r\nhttps://github.com/pallets/click/blob/6411f425fae545f42795665af4162006b36c5e4a/src/click/core.py#L2267-L2283\r\
  \n\r\n(i.e. if value is an empty string, `None` is returned)\r\n\r\nBut then here\
  \ it is fetched as is without checking for an empty string:\r\nhttps://github.com/pallets/click/blob/6411f425fae545f42795665af4162006b36c5e4a/src/click/core.py#L2777-L2783\r\
  \n\r\nThe most obvious fix would be to add the following 2 lines\r\n``` python\r\
  \nif rv:\r\n    return rv\r\n```\r\nafter\r\nhttps://github.com/pallets/click/blob/6411f425fae545f42795665af4162006b36c5e4a/src/click/core.py#L2783\n"
