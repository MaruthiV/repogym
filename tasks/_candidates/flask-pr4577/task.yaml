prompt: 'Unify `setupmethod` behavior between `Flask` and `Blueprint`


  Many of the methods in the `Flask` app object are decorated with `setupmethod`,
  which prevents registering things with the application after it starts running.
  A similar behavior is in `Blueprint`, we want to prevent modifying it after registering
  it at least once. However, the blueprint checking is much less consistent, it''s
  divided up into two parts, is only a warning sometimes, and has a different message.
  Figure out how we can make `Flask` and `Blueprint` more consistent with this error.

  '
