source: mined
prompt: "PackageLoader fails loading from zip/egg when package_path=\"\"\n\nI was\
  \ trying to use the PackageLoader to load template files from a package.\r\n\r\n\
  ```python\r\nenv = jinja2.Environment(\r\n    autoescape=False,\r\n    loader=jinja2.PackageLoader(\"\
  testpkg\", \"\"),\r\n    trim_blocks=True,\r\n    lstrip_blocks=True,\r\n    keep_trailing_newline=True,\r\
  \n    undefined=jinja2.StrictUndefined\r\n)\r\ntemplate = env.get_template(\"template-file.txt.in\"\
  )\r\n```\r\n\r\nThis works fine during development, but after packaging the module\
  \ into an .egg file, it fails to load the file with:\r\n\r\n```\r\nTraceback (most\
  \ recent call last):\r\n  File \"<frozen zipimport>\", line 177, in get_data\r\n\
  KeyError: 'testpkg/./template-file.txt.in'\r\n\r\nDuring handling of the above exception,\
  \ another exception occurred:\r\n\r\nTraceback (most recent call last):\r\n  File\
  \ \"/home/user/miniconda3/envs/pyenv/lib/python3.9/site-packages/jinja2/loaders.py\"\
  , line 338, in get_source\r\n    source = self._loader.get_data(p)  # type: ignore\r\
  \n  File \"<frozen zipimport>\", line 179, in get_data\r\nOSError: [Errno 0] : 'testpkg/./template-file.txt.in'\r\
  \n```\r\n\r\nEnvironment:\r\n\r\n- Python version: Python 3.9.4\r\n- Jinja version:\
  \ 3.0.1\r\n\r\n\r\nCause:\r\n\r\nInside ZIP files, the `.` (for current directory)\
  \ is an invalid path, thus it fails to find the file.\r\n\r\nThe PackageLoader actually\
  \ tries to remove the dot from the path, here:\r\nhttps://github.com/pallets/jinja/blob/8c031bf203d5279879329c3423383330ec98fa1e/src/jinja2/loaders.py#L273-L278\r\
  \nbut it fails to do so, because `os.path.normpath(\"\")` results in `'.'` again.\r\
  \nThus, the package_path ends up as `\".\"` for the input values `\"\"` and `\"\
  .\"`, breaking ZIP support in both cases.\r\n\r\nCalling `normpath` first and cleaning\
  \ the path afterwards (273..276) should fix the bug.\r\nAlternatively one could\
  \ normalize the path again after the join in https://github.com/pallets/jinja/blob/8c031bf203d5279879329c3423383330ec98fa1e/src/jinja2/loaders.py#L319\n"
