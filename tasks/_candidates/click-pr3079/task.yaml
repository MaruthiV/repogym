prompt: "`default=True` on feature flags is order-sensitive\n\nThe following code:\n\
  \n```python\nimport click\n\n\n@click.command()\n@click.option(\"--red\", \"color\"\
  , flag_value=\"red\")\n@click.option(\"--green\", \"color\", flag_value=\"green\"\
  , default=True)\n@click.option(\"--blue\", \"color\", flag_value=\"blue\")\ndef\
  \ main(color: str) -> None:\n    print(repr(color))\n\n\nif __name__ == \"__main__\"\
  :\n    main()\n```\n\nwhen run with no arguments using click 8.2.1 outputs `'green'`,\
  \ which is what I expect.  If click 8.3.0 is used instead, then it outputs `None`\
  \ — but if the `--green` option is moved above the `--red` option in the script,\
  \ click 8.3.0 will output `'green'`.\n\nI believe that the script should output\
  \ `'green'` regardless of the declaration order of the options.\n\nEnvironment:\n\
  \n- Python version: 3.13.7\n- Click version: 8.2.1 and 8.3.0\n"
