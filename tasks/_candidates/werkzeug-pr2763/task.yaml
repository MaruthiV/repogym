prompt: "Extra Newline Added to Binary File Upload\n\n## Problem:\r\nAfter uploading\
  \ a specific binary file, an unexpected newline character (\\n) is being added to\
  \ the beginning of the file. This behavior is traced back to Werkzeug's multipart\
  \ request body parsing during POST requests.\r\n\r\n## Steps to Reproduce:\r\n\r\
  \n1. Create a binary file named one_newline_bigger_than_64k with the following content:\r\
  \n```py\r\nwith open(\"one_newline_bigger_than_64k\", \"wb\") as file:\r\n    bytes_to_write\
  \ = b'X' + b'\\n' + 64 * 1024 * b'c'\r\n    file.write(bytes_to_write)\r\n```\r\n\
  2. Upload the one_newline_bigger_than_64k file.\r\n3. Compare the binary content\
  \ of the original and uploaded files.\r\n## Root Cause:\r\nThis issue arises due\
  \ to Werkzeug's [_parse_data](https://github.com/pallets/werkzeug/blob/main/src/werkzeug/sansio/multipart.py#L246)\
  \ method. Specifically, when a newline (\\n or \\r) is present at the second position\
  \ (index 1) of the file's content and no additional newlines are within the first\
  \ 64KB of the request body, an extra newline is inadvertently introduced during\
  \ parsing.\r\n\r\n## Code Flow:\r\n\r\n1. Werkzeug's next_event method invokes _parse_data.\r\
  \n2. In _parse_data, a data_start value is set based on the file's content type.\r\
  \n3. If the boundary indicator is absent in the buffer, the [last_newline](https://github.com/pallets/werkzeug/blob/main/src/werkzeug/sansio/multipart.py#L124)\
  \ method is employed to locate the latest newline (\\n or \\r) character in the\
  \ file's content. However, this method operates on a modified data slice that starts\
  \ at data_start.\r\n4. Since data is modified, any index from last_newline needs\
  \ data_start adjustment.\r\n5. Incorrectly adjusted indices lead to an empty byte\
  \ segment when slicing data[data_start:data_end], resulting in an empty data segment.\r\
  \n6. This leads to an unintended addition of a newline character in the file's content.\r\
  \n## Solution:\r\nTo resolve this, a correction in the _parse_data method is needed.\
  \ The index returned by last_newline should be adjusted by adding the data_start\
  \ before slicing data.\r\n\r\n### Proposed Fix:\r\nUpdate _parse_data as follows:\r\
  \n\r\n```py\r\n# Inside _parse_data method\r\nif self.buffer.find(b\"--\" + self.boundary)\
  \ == -1:\r\n    # No complete boundary in buffer, but a partial boundary might exist.\
  \ \r\n    # Find the earliest newline (nl or cr) and return data up to that.\r\n\
  \    last_newline_idx = self.last_newline(data[data_start:])\r\n    data_end = del_index\
  \ = last_newline_idx + data_start  # Adjusted index\r\n    more_data = True\r\n\
  ```\r\n\r\n## Environment:\r\n\r\nPython: 3.10.12\r\nWerkzeug: 2.3.6\r\n\r\n## Resolution:\r\
  \nA pull request will be created to implement this fix, preventing unintended newline\
  \ addition in binary file uploads. This adjustment ensures proper index handling,\
  \ preventing unintended manipulation of file content during parsing.\n"
