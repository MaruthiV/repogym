prompt: "`show_choices=False` seems to have no effect\n\nI noticed when using Typer\
  \ that even if you pass `show_choices=False`, the choices still get shown in the\
  \ help. It seems that this is related to Click.\r\n\r\nExample:\r\n```python\r\n\
  import click\r\n\r\n@click.command()\r\n@click.option('-s', '--string-to-echo',\
  \ type=click.Choice(['hello', 'world']), show_choices=False)\r\ndef echo(string):\r\
  \n    click.echo(string)\r\n\r\nif __name__ == \"__main__\":\r\n    echo()\r\n```\r\
  \n```\r\nUsage: ... [OPTIONS]\r\n\r\nOptions:\r\n  -s, --string-to-echo [hello|world]\r\
  \n  --help                          Show this message and exit.\r\n```\r\n\r\nI\
  \ guess it isn't documented what `show_choices` does for `Option` (if anything)\
  \ in the non-prompt case, but I expected `show_choices=False` to disable showing\
  \ the choices in the help.\r\n\r\nEnvironment:\r\n\r\n- Python version: 3.9.13\r\
  \n- Click version: 8.1.3\n"
