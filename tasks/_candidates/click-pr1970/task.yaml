prompt: "Empty default value in --help output for option with multiple=True\n\n##\
  \ Minimal reproducible example that demonstrates the bug\r\n\r\n```python\r\n#!/usr/bin/env\
  \ python3\r\n\r\nimport click\r\n\r\n@click.command()\r\n@click.option('--multioption',\
  \ multiple=True, default=None, help='My help', show_default=True)\r\ndef info(_multioption):\r\
  \n    pass\r\n\r\n\r\nif __name__ == '__main__':\r\n    info()\r\n```\r\n\r\nNotice\
  \ `multiple=True` which is crucial. If you replace it with `multiple=False` it will\
  \ work just fine.\r\n\r\n### What I get\r\n\r\n```console\r\n$ ./test.py --help\r\
  \nUsage: test.py [OPTIONS]\r\n\r\nOptions:\r\n  --multioption TEXT  My help  [default:\
  \ ]\r\n  --help              Show this message and exit.  [default: False]\r\n```\r\
  \n\r\n### Expected output\r\n\r\n```console\r\n$ ./test.py --help\r\nUsage: test.py\
  \ [OPTIONS]\r\n\r\nOptions:\r\n  --multioption TEXT  My help\r\n  --help       \
  \       Show this message and exit.  [default: False]\r\n```\r\n\r\n## Environment\r\
  \n\r\n### Python version\r\n\r\n```console\r\n$ python3 --version\r\nPython 3.9.2\r\
  \n```\r\n\r\n### Click version\r\n\r\n```console\r\n$ python -c \"import click;\
  \ print(click.__version__)\"\r\n8.0.1\r\n```\r\n(I checked that `8.0.2.dev0` is\
  \ also affected)\n"
