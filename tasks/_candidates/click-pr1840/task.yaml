prompt: "context.forward inconsistently removes undeclared options\n\n### Expected\
  \ Behavior\r\n\r\nThree commands. The first takes a subset of the options that the\
  \ last two take. Each prints the arguments they were called with. All but the first\
  \ call the one before it via `context.forward`.\r\n\r\n```python\r\nimport click\r\
  \nfrom pprint import pprint\r\n\r\n@click.group()\r\ndef main():\r\n    pass\r\n\
  \r\n@main.command()\r\n@click.option('-a')\r\ndef first(**kwargs):\r\n    print('first')\r\
  \n    pprint(kwargs)\r\n\r\n@main.command()\r\n@click.option('-a')\r\n@click.option('-b')\r\
  \n@click.pass_context\r\ndef second(context, **kwargs):\r\n    print('second')\r\
  \n    pprint(kwargs)\r\n    context.forward(first)\r\n\r\n@main.command()\r\n@click.option('-a')\r\
  \n@click.option('-b')\r\n@click.pass_context\r\ndef third(context, **kwargs):\r\n\
  \    print('third')\r\n    pprint(kwargs)\r\n    context.forward(second)\r\n\r\n\
  main()\r\n```\r\n\r\nHere's the behavior I expect from each command. Notably, `first`\
  \ is called with the same arguments, its declared options, each time.\r\n\r\n```\r\
  \n$ python main.py first\r\nfirst\r\n{'a': None}\r\n$ python main.py second\r\n\
  second\r\n{'a': None, 'b': None}\r\nfirst\r\n{'a': None}\r\n$ python main.py third\r\
  \nthird\r\n{'a': None, 'b': None}\r\nsecond\r\n{'a': None, 'b': None}\r\nfirst\r\
  \n{'a': None}\r\n```\r\n\r\n\r\n### Actual Behavior\r\n\r\n```\r\n$ python main.py\
  \ first\r\nfirst\r\n{'a': None}\r\n$ python main.py second\r\nsecond\r\n{'a': None,\
  \ 'b': None}\r\nfirst\r\n{'a': None, 'b': None}     # 'first' is called with 'b'\
  \ here\r\n$ python main.py third\r\nthird\r\n{'a': None, 'b': None}\r\nsecond\r\n\
  {'a': None, 'b': None}\r\nfirst\r\n{'a': None}                # but not here\r\n\
  ```\r\n\r\n\r\n### Environment\r\n\r\n* Python version: 3.7.5\r\n* Click version:\
  \ 7.1.2\n"
