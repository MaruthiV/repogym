prompt: "Add support for RFC5861 Cache-Control headers\n\n[RFC5861](https://datatracker.ietf.org/doc/html/rfc5861)\
  \ standardised two Cache-Control extensions:\r\n1. `stale-while-revalidate`\r\n\
  2. `stale-if-error`\r\n\r\nPlease add support for these in the standard werkzerg\
  \ `ResponseCacheControl`.\r\n\r\nOne use case of these extensions is to allow sites\
  \ to have their CDNs \"coalesce\" requests for content when it goes stale.  Another\
  \ is to serve a stale representation from the CDN when the site is having an outage.\
  \  It's possible to solve this problem without changes to werkzeug, but as it's\
  \ a standard feature, I think it would be nice to have it in the library.\n"
