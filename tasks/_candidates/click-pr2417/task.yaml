prompt: "Cannot use parameterless command decorator with custom command_class\n\n\
  Click throws an assertion error if you try to use the parameterless command decorator\
  \ on a group with a command_class defined. The error is due to the command_class\
  \ being added to kwargs before the assertion for no kwargs.\r\n\r\n\r\n# minimal\
  \ repro\r\n```\r\nimport click\r\n\r\nclass CustomCommand(click.Command):\r\n  \
  \  pass\r\n\r\nclass CustomGroup(click.Group):\r\n    command_class = CustomCommand\r\
  \n\r\n@click.group(cls=CustomGroup)\r\ndef grp():\r\n    pass\r\n\r\n@grp.command\r\
  \ndef cli():\r\n    click.echo(\"hello custom command class\")\r\n```\r\n## error\r\
  \n\r\n```\r\newilliamson@ip-192-168-50-39 ~ % python minimal_repro.py\r\nTraceback\
  \ (most recent call last):\r\n  File \"/Users/ewilliamson/minimal_repro.py\", line\
  \ 14, in <module>\r\n    def cli():\r\n  File \"/Users/ewilliamson/.pyenv/versions/3.10.7/lib/python3.10/site-packages/click/core.py\"\
  , line 1847, in command\r\n    assert (\r\nAssertionError: Use 'command(**kwargs)(callable)'\
  \ to provide arguments.\r\n```\r\n\r\n## expected\r\nThe `@grp.command` would be\
  \ successfully parsed the same as without using `CustomGroup`\r\n\r\n\r\n\r\nEnvironment:\r\
  \n\r\n- Python version: `Python 3.10.7`\r\n- Click version: `click==8.1.3`\n"
