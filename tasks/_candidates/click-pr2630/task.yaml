source: mined
prompt: "Make ProgressBar type available in public interface\n\n`mypy` considers function\
  \ `click.progressbar()` as generic with type parameter `V`: https://github.com/pallets/click/blob/ca5e1c3d75e95cbc70fa6ed51ef263592e9ac0d0/src/click/termui.py#L287-L303\r\
  \n\r\nIn most cases type parameter `V` will be inferred from `iterable` function\
  \ parameter:\r\n\r\n```python\r\nfrom typing import reveal_type\r\n\r\nimport click\r\
  \n\r\nwith click.progressbar([1, 2, 3]) as bar:\r\n    reveal_type(bar) # Revealed\
  \ type is \"click._termui_impl.ProgressBar[builtins.int]\"\r\n```\r\n\r\nHowever,\
  \  if `iterable` parameter is not specified (or if it's empty list), type parameter\
  \ `V` cannot be inferred: \r\n\r\n```python\r\nimport click\r\n\r\nwith click.progressbar(length=1)\
  \ as bar:\r\n    pass\r\n```\r\n\r\n```\r\n$ mypy mypy_click/__init__.py \r\nmypy_click/__init__.py:3:\
  \ error: Need type annotation for \"bar\"  [var-annotated]\r\n```\r\n\r\nThis issue\
  \ can be solved with manually specified type parameter:\r\n\r\n```python\r\nimport\
  \ click\r\n\r\nwith click.progressbar[int](length=1) as bar:\r\n    pass\r\n```\r\
  \nUnfortunately, this doesn't work for functions:\r\n\r\n```\r\n$ mypy mypy_click/\r\
  \nmypy_click/__init__.py:3: error: Type application is only supported for generic\
  \ classes  [misc]\r\n```\r\n\r\nAnother way to fix this is specify type for variable\
  \ `bar`:\r\n\r\n```python\r\nfrom typing import cast\r\n\r\nimport click\r\nfrom\
  \ click._termui_impl import ProgressBar\r\n\r\nwith cast(ProgressBar[int], click.progressbar(length=1))\
  \ as bar:\r\n    pass\r\n\r\n# or\r\n\r\nwith click.progressbar(length=1) as bar:\
  \ # type: ProgressBar[int]\r\n    pass\r\n``` \r\n\r\nBut in this case `ProgressBar`\
  \ is imported as not a part of public interface.\r\n\r\nSo, I think `ProgressBar`\
  \ *type* should be a part of the public interface. Maybe it should not\r\nbe exported\
  \ directly like class, because users should use `click.progressbar()` function instead.\r\
  \nPublic `ProgressBar` type can be defined as [protocol](https://peps.python.org/pep-0544/)\
  \ and `click.progressbar()` just returns its implementation.\r\n\r\nEnvironment:\r\
  \n\r\n- Python version: 3.11.5\r\n- Click version: 8.1.7\r\n- Mypy version: 1.6.1\n"
