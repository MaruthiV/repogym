source: mined
prompt: "CliRunner prompt input echos twice on Python 2\n\n```python\r\nimport click\r\
  \nfrom click.testing import CliRunner\r\n\r\n@click.command()\r\ndef cli():\r\n\
  \    prompt(\"value\")\r\n    click.echo(\"done\")\r\n\r\nrunner = CliRunner(echo_stdin=True)\r\
  \nresult = runner.invoke(cli, input=\"test\")\r\nprint(result.output)\r\n```\r\n\
  \r\nPython 3 output (correct):\r\n\r\n```\r\nvalue: test\r\ndone\r\n```\r\n\r\n\
  Python 2 output:\r\n\r\n```\r\nvalue: testtest\r\ndone\r\n```\r\n\r\nI went back\
  \ and this appears to be the case in every version since 1.x. The issue seems to\
  \ be with the `visible_input` function in `CliRunner.isolation`. It uses `input`\
  \ after that has been wrapped in `EchoingStdin`. It appears to work in Python 3\
  \ due to some weird lookup behavior, but that appears to be an accident.  There\
  \ are no tests for `echo_stdin` and `prompt` at the same time.\r\n\r\nIt didn't\
  \ show up in the docs because the docs runner overrode `isolation` with different\
  \ code that had `visible_input` pull from the original input and only replaced `sys.stdin`\
  \ with the EchoingStdin wrapper, rather than both with the wrapper. While porting\
  \ the docs runner to pallets-sphinx-themes, I removed that code in favor of simpler\
  \ subclassing, and noticed that the docs had double input, which led me to discover\
  \ the full issue.\n"
