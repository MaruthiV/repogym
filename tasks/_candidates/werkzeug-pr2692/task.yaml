prompt: "Use of warnings.catch_warnings resets the global warnings registry\n\nThere\
  \ is a long-standing bug in Python python/cpython#73858 whereby any use of `warnings.catch_warnings`\
  \ causes all memory of which warnings have already been displayed to be lost.  So\
  \ warnings whose [action](https://docs.python.org/3/library/warnings.html#the-warnings-filter)\
  \ is configured as \"default\" (meaning show once for each module/line-number) get\
  \ displayed multiple (possibly many, many) times.\r\n\r\nNote that use of `catch_warnings`\
  \ resets memory of what warnings have been displayed globally — use of `catch_warnings`\
  \ by werkzeug can cause redisplay of unrelated warnings from other modules.\r\n\r\
  \nPR #2608 (19d55c1e01d628d9a256526b573f478248d4bc5a) introduced a lot of new uses\
  \ of `catch_warnings`.\r\n\r\nI'm not sure what the clean way is to work-around\
  \ the issue, but it would be nice not to break the \"default\" warning action so\
  \ drastically.\r\n\r\n\r\n\r\n\r\nExample: `too-verbose.py`:\r\n```py\r\nfrom werkzeug.urls\
  \ import url_parse\r\n\r\nfor _ in range(10):\r\n    url_parse(\"x\")\r\n```\r\n\
  \r\nRunning\r\n```sh\r\npython too-verbose.py\r\n```\r\nwill elicit 10 `url_parse`\
  \ deprecation warnings.  (The default warnings filter specifies an action of \"\
  default\" for DeprecationWarnings, which means that they should be displayed just\
  \ once per location.)\r\n\r\n\r\n\r\nEnvironment:\r\n\r\n- Python version: I've\
  \ tested under 3.9 and 3.11.  I think it affects all 3.x pythons.\r\n- Werkzeug\
  \ version: 2.3.3\n"
