prompt: "`stream_with_context` does not work with async routes\n\nConsider this trivial\
  \ route + test in `app.py`:\n\n```python\nimport flask\nfrom flask import Flask\n\
  from flask import Response\n\nimport pytest\n\napp = Flask(__name__)\n\n\n@app.route(\"\
  /foo\")\nasync def foo():\n    def gen():\n        yield \"bar\"\n\n    return Response(flask.stream_with_context(gen()))\n\
  \n\ndef test_foo():\n    with app.test_client() as client:\n        client.get(\"\
  /foo\")\n```\n\nWith the following `requirements.txt`:\n\n```\nflask[async]==3.1.1\n\
  pytest==8.4.1\nwerkzeug==3.1.3\n```\n\nRunning `pytest app.py` results in:\n\n```\n\
  ============================= test session starts ==============================\n\
  platform darwin -- Python 3.12.11, pytest-8.4.1, pluggy-1.6.0\nrootdir: /private/tmp/stream_with_context\n\
  collected 1 item\n\napp.py F                                                   \
  \              [100%]\n\n=================================== FAILURES ===================================\n\
  ___________________________________ test_foo ___________________________________\n\
  \n    def test_foo():\n        with app.test_client() as client:\n>           client.get(\"\
  /foo\")\n\napp.py:20:\n_ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _\
  \ _ _ _ _ _ _ _ _ _ _ _\nvenv/lib/python3.12/site-packages/werkzeug/test.py:1162:\
  \ in get\n    return self.open(*args, **kw)\n           ^^^^^^^^^^^^^^^^^^^^^^\n\
  venv/lib/python3.12/site-packages/flask/testing.py:235: in open\n    response =\
  \ super().open(\nvenv/lib/python3.12/site-packages/werkzeug/test.py:1116: in open\n\
  \    response_parts = self.run_wsgi_app(request.environ, buffered=buffered)\n  \
  \                   ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\nvenv/lib/python3.12/site-packages/werkzeug/test.py:988:\
  \ in run_wsgi_app\n    rv = run_wsgi_app(self.application, environ, buffered=buffered)\n\
  \         ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\nvenv/lib/python3.12/site-packages/werkzeug/test.py:1264:\
  \ in run_wsgi_app\n    app_rv = app(environ, start_response)\n             ^^^^^^^^^^^^^^^^^^^^^^^^^^^^\n\
  venv/lib/python3.12/site-packages/flask/app.py:1536: in __call__\n    return self.wsgi_app(environ,\
  \ start_response)\n           ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\nvenv/lib/python3.12/site-packages/flask/app.py:1527:\
  \ in wsgi_app\n    ctx.pop(error)\n_ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _\
  \ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _\n\nself = <RequestContext 'http://localhost/foo'\
  \ [GET] of app>, exc = None\n\n    def pop(self, exc: BaseException | None = _sentinel)\
  \ -> None:  # type: ignore\n        \"\"\"Pops the request context and unbinds it\
  \ by doing that.  This will\n        also trigger the execution of functions registered\
  \ by the\n        :meth:`~flask.Flask.teardown_request` decorator.\n\n        ..\
  \ versionchanged:: 0.9\n           Added the `exc` argument.\n        \"\"\"\n \
  \       clear_request = len(self._cv_tokens) == 1\n\n        try:\n            if\
  \ clear_request:\n                if exc is _sentinel:\n                    exc\
  \ = sys.exc_info()[1]\n                self.app.do_teardown_request(exc)\n\n   \
  \             request_close = getattr(self.request, \"close\", None)\n         \
  \       if request_close is not None:\n                    request_close()\n   \
  \     finally:\n            ctx = _cv_request.get()\n            token, app_ctx\
  \ = self._cv_tokens.pop()\n>           _cv_request.reset(token)\nE           ValueError:\
  \ <Token var=<ContextVar name='flask.request_ctx' at 0x103cd9a30> at 0x104b23a40>\
  \ was created in a different Context\n\nvenv/lib/python3.12/site-packages/flask/ctx.py:418:\
  \ ValueError\n=========================== short test summary info ============================\n\
  FAILED app.py::test_foo - ValueError: <Token var=<ContextVar name='flask.request_ctx'\
  \ at 0x103cd9a30>...\n============================== 1 failed in 0.11s ===============================\n\
  ```\n\nSimilarly, `python -m flask run` and then `curl http://127.0.0.1:5000/foo`\
  \ results in:\n\n```\n127.0.0.1 - - [15/Jul/2025 13:40:14] \"GET /foo HTTP/1.1\"\
  \ 500 -\nError on request:\nTraceback (most recent call last):\n  File \"/private/tmp/stream_with_context/venv/lib/python3.12/site-packages/wer\n"
