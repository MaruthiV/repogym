prompt: "`int` and `float` converter issues\n\nThis is a more conservative version\
  \ of #3237 that only fixes bugs/unintended behavior and otherwise doesn't break\
  \ existing URLs. I'll target this at 3.2 since it does change what's accept a bit\
  \ still.\n\n- Non-ASCII digits are accepted.\n- `int(fixed_digits=4, signed=True)`\
  \ counts the negative sign as a digit.\n- `float` overflow values (too large to\
  \ fit in float) become `inf`, which is a special, unexpected value that can cause\
  \ problems when used later on.\n  - Underflow values become `0.0`, which is a \"\
  normal\" value.\n  - Binary float cannot represent all values, but that's a very\
  \ abstract concept for users to understand and ensure in URLs.\n- #3147 prevented\
  \ scientific notation by limiting to 6 decimal places, which excludes many legitimate\
  \ values.\n\nA 1-to-1 mapping of URLs to parsed values is not a goal. This will\
  \ be documented for these converters. However, `.4 and `4.` will remain disallowed,\
  \ I want to keep the more obvious `left.right` syntax only. And `4.` would cause\
  \ issues with Markdown URL detection.\n\nThe private `NumberConverter` base seems\
  \ to be more trouble than the small amount of duplication it removes, especially\
  \ if we also tried to extend it to `decimal` later, so I'll remove it.\n"
