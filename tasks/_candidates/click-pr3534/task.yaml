prompt: "Flush `stdin` after writing to a pager\n\nI would love to see text immediately\
  \ in this toy example:\n```python\nimport click\nimport os\nimport time\n\ndef _generator():\n\
  \    for i in range(10000):\n        time.sleep(0.01)\n        yield f\"{i+1:07}\\\
  n\"\n\n@click.command\ndef main():\n    os.environ.setdefault(\"LESS\", \"-XFR\"\
  )\n    click.echo_via_pager(_generator())\n\nmain()\n```\nAs it is currently, nothing\
  \ will show until 512 lines have been `yield`ed.\nI suspect a flush after this line\
  \ would do the trick:\nhttps://github.com/pallets/click/blob/cdab890e57a30a9f437b88ce9652f7bfce980c1f/src/click/_termui_impl.py#L468\n\
