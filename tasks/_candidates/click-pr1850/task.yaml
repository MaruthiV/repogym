prompt: "Bug: `make_default_short_help` can return strings as long as `max_length\
  \ + 3`\n\n## The bug\r\nThe current algorithm doesn't take into account the length\
  \ of \"...\" properly:\r\n\r\n```python\r\nfrom click.utils import make_default_short_help\r\
  \n\r\nout = make_default_short_help('1234 67890 xxxxxx', max_length=10)\r\nprint(out)\r\
  \nprint('Length:', len(out))\r\n```\r\nPrints:\r\n```\r\n1234 67890...\r\nLength:\
  \ 13\r\n```\r\nExpected output: `1234...`\r\n\r\n## Environment\r\n- Click version:\
  \ 7.2 and master\r\n\r\n## Solution\r\nI'm going to open a PR.\r\n\r\n## Related\
  \ issue (or: why this bug has never been reported)\r\nThe reason this bug has not\
  \ been reported is because another \"issue\" compensates for it, making sure it\
  \ never manifests itself in the terminal. The following code is from `Group.format_commands`:\r\
  \n\r\nhttps://github.com/pallets/click/blob/0dc6d74df5c984ff923f5d17e97bf94a21b3a3cd/src/click/core.py#L1501-L1508\r\
  \n\r\n`Group.format_commands` needs to know `col_spacing` to calculate the width\
  \ of the 2nd column (i.e. the short help `limit`). But it: \r\n- doesn't set `col_spacing`\
  \ in `formatter.write_dl` and, \r\n- it assumes that the formatter won't necessarily\
  \ use the default `col_spacing` value (note that the only way to change it is to\
  \ subclass `HelpFormatter` and override `write_dl`; not a very clean use of inheritance).\r\
  \n\r\nAs a consequence, it makes the conservative choice of \"allowing for 3 times\
  \ the default `col_spacing`\" subtracting 6 to `limit` (i.e. `max_length`). Because\
  \ `col_spacing` will always be 2, the `limit` will always be 4 characters smaller\
  \ than needed, compensating for the eventual excess of 3 characters due to the bug\
  \ reported in this issue.\r\n\r\nLet me know if I misunderstood something.\n"
