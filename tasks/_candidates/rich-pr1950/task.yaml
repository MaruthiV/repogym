prompt: "[BUG] List of numpy arrays does not print correctly\n\nThe bug is actually\
  \ rather simple. Whenever you attempt to print a list that consists of NumPy arrays,\
  \ it cuts off the first element of the list when combined with a string. Below is\
  \ a minimal code example that shows the bug:\r\n\r\n```Python\r\nimport numpy as\
  \ np\r\nfrom rich import print\r\n\r\nlist_of_arrays = [np.array([1, 0, 0]), np.array([0,\
  \ 1, 0]), np.array([0, 0, 1])]\r\nprint(list_of_arrays)\r\nprint(f'Does something\
  \ weird with f strings: {list_of_arrays}')\r\n```\r\noutput\r\n```\r\n[array([1,\
  \ 0, 0]), array([0, 1, 0]), array([0, 0, 1])]\r\nDoes something weird with f strings:\
  \ ), array([0, 1, 0]), array([0, 0, 1])]\r\n```\r\nOf course, the output should\
  \ be that the second line also shows the complete list.\r\nI provide a screenshot\
