prompt: "Several issues with CacheControl types\n\nThis issue is in three parts:\r\
  \n\r\n### `no-transform` directive always returns None\r\n\r\nThis directive has\
  \ no arguments (either in current RFC 9111 or older RFC 2616)\r\n\r\n```python\r\
  \nfrom werkzeug.http import parse_cache_control_header\r\n\r\ncc = parse_cache_control_header(\"\
  no-transform\")\r\nprint(f\"{cc.no_transform=}\")\r\n```\r\n\r\nOutput: \r\n```\r\
  \ncc.no_transform=None\r\n```\r\n\r\nExpected: boolean based on presence\r\n\r\n\
  ### `min-fresh` directive returns `\"*\"` if missing required argument\r\n\r\n```python\r\
  \nfrom werkzeug.http import parse_cache_control_header\r\n\r\ncc = parse_cache_control_header(\"\
  min-fresh\")\r\nprint(f\"{cc.min_fresh=}\")\r\n```\r\n\r\nOutput:\r\n```\r\ncc.min_fresh='*'\r\
  \n```\r\n\r\nExpected: `None` since the argument is required and `\"*\"` doesn't\
  \ have a semantic meaning for this directive.\r\n\r\n### type stubs are incorrect\r\
  \n\r\n- `no_cache` returns `str` not `bool`.\r\n- `bool` properties never return\
  \ `None`\r\n- `max_stale` returns `\"*\"` in addition to `int`.\r\n- `RequestCacheControl`\
  \ immutability is not reflected.\r\n\r\nEnvironment:\r\n\r\n- Python version: N/A\r\
  \n- Werkzeug version: 3.0.2\n"
