prompt: "test.Client is incorrectly using isinstance check instead of issubclass\n\
  \nThe documentation for `werkzeug.test.Client` says it expects a subclass of `TestResponse`,\
  \ failing which it will construct the subclass:\r\n\r\nhttps://github.com/pallets/werkzeug/blob/5ff0a573f4b78d9724f1f063fb058fd6bc76b24d/src/werkzeug/test.py#L778-L780\r\
  \n\r\nHowever, the implementation is using `isinstance` instead of `issubclass`:\r\
  \n\r\nhttps://github.com/pallets/werkzeug/blob/5ff0a573f4b78d9724f1f063fb058fd6bc76b24d/src/werkzeug/test.py#L812-L817\r\
  \n\r\nThe problem was introduced in commit 669323cf3c9c9241522e16a8a445450a0b9a55c9\
  \ ([specific lines](https://github.com/pallets/werkzeug/commit/669323cf3c9c9241522e16a8a445450a0b9a55c9#diff-e00d1f616a746837a6f12a882341f83276f8b0b2781800695c65c5b7ed041db3R847-R850))\
  \ so it's been around since the 2.0 release.\n"
