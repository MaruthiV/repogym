prompt: "White space U+000C FORM FEED in template not preserved\n\n## Expected Behavior\r\
  \n\r\nA template containing the white space character U+000C FORM FEED should render\
  \ with that white space character preserved in the rendered output.\r\n\r\n```\r\
  \n>>> import pprint\r\n>>> import textwrap\r\n>>> template_content = textwrap.dedent(\"\
  \"\"\\\r\n...     Lorem ipsum, dolor sit amet, consectetur adipiscing elit.\r\n\
  ...     \\N{FORM FEED}\r\n...     Pellentesque maximus a ligula ut vehicula.\r\n\
  ...     \"\"\")\r\n>>> pprint.pprint(template_content)\r\n('Lorem ipsum, dolor sit\
  \ amet, consectetur adipiscing elit.\\n'\r\n '\\x0c'\r\n '\\n'\r\n 'Pellentesque\
  \ maximus a ligula ut vehicula.\\n')\r\n>>> import jinja2\r\n>>> jinja2.__version__\r\
  \n'2.10'\r\n>>> template = jinja2.Template(template_content)\r\n>>> pprint.pprint(template.render())\r\
  \n('Lorem ipsum, dolor sit amet, consectetur adipiscing elit.\\n'\r\n '\\x0c'\r\n\
  \ '\\n'\r\n 'Pellentesque maximus a ligula ut vehicula.')\r\n```\r\n\r\n## Actual\
  \ Behavior\r\n\r\nThe U+000C character is removed and replaced with U+000A LINE\
  \ FEED.\r\n\r\n```\r\n>>> import pprint\r\n>>> import textwrap\r\n>>> template_content\
  \ = textwrap.dedent(\"\"\"\\\r\n...     Lorem ipsum, dolor sit amet, consectetur\
  \ adipiscing elit.\r\n...     \\N{FORM FEED}\r\n...     Pellentesque maximus a ligula\
  \ ut vehicula.\r\n...     \"\"\")\r\n>>> pprint.pprint(template_content)\r\n('Lorem\
  \ ipsum, dolor sit amet, consectetur adipiscing elit.\\n'\r\n '\\x0c'\r\n '\\n'\r\
  \n 'Pellentesque maximus a ligula ut vehicula.\\n')\r\n>>> import jinja2\r\n>>>\
  \ jinja2.__version__\r\n'2.9.6'\r\n>>> template = jinja2.Template(template_content)\r\
  \n>>> pprint.pprint(template.render())\r\n('Lorem ipsum, dolor sit amet, consectetur\
  \ adipiscing elit.\\n'\r\n '\\n'\r\n '\\n'\r\n 'Pellentesque maximus a ligula ut\
  \ vehicula.')\r\n```\r\n\r\n## Environment\r\n* Python version: Python 3.5.4\r\n\
  * Jinja version: 2.9.6\n"
