prompt: "Click 8.0.0 `group.add_command(..)` does not replace name in description\
  \ and when looking up defaults\n\nWith click 8.0.0 `click.group.add_command(..)`\
  \ changed the behavior in how new command names are used:\r\nBoth the help text\
  \ for the command as well as when looking up default values in `default_map` the\
  \ previous command name instead of the one added by the group are shown.\r\n\r\n\
  Minimal example:\r\n\r\n```\r\n# test.py\r\nimport click\r\n\r\n@click.command()\r\
  \n@click.option(\r\n    \"--qux\",\r\n    required=True\r\n)\r\ndef foo(qux):\r\n\
  \    print(qux)\r\n\r\n@click.group()\r\ndef group():\r\n    pass\r\n\r\ngroup.add_command(foo,\
  \ \"bar\")\r\n\r\ngroup(default_map={\"bar\": {\"qux\": \"val\"}})\r\n```\r\nRun\
  \ the above:\r\n* with click 7.x: \r\n> $ python3 test.py bar --help\r\n> Usage:\
  \ test.py bar [OPTIONS]\r\n> // and\r\n> $ python3 test.py bar\r\n> val\r\n* with\
  \ click 8.0.0:\r\n> $ python3 test.py bar --help\r\n> Usage: test.py foo [OPTIONS]\r\
  \n> // and\r\n> $ python3 test.py bar\r\n> Usage: test.py foo [OPTIONS]\r\n> Try\
  \ 'test.py foo --help' for help.\r\n>\r\n> Error: Missing option '--qux'.\r\n\r\n\
  I would have expected that both the help shows the name of the command as \"bar\"\
  \ (as using \"foo\" will result in an error)\r\nand the lookup for the default using\
  \ \"bar\" as a key.\r\n\r\nEnvironment:\r\n\r\n- Python version: 3.9.5\r\n- Click\
  \ version: 8.0.0\n"
