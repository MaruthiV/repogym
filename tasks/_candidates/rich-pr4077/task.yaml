prompt: "`FileProxy.isatty()` always returns `False` instead of delegating to the\
  \ proxied file\n\n- [x] I've checked [docs](https://rich.readthedocs.io/en/latest/introduction.html)\
  \ and [closed issues](https://github.com/Textualize/rich/issues?q=is%3Aissue+is%3Aclosed)\
  \ for possible solutions.\n- [x] I can't find my issue in the [FAQ](https://github.com/Textualize/rich/blob/master/FAQ.md).\n\
  \n`FileProxy` (used by `Live` when `redirect_stdout=True`) inherits `isatty()` from\
  \ `io.TextIOBase`, which always returns `False`. This breaks code that checks `sys.stdout.isatty()`\
  \ inside a `Live` context.\n\n`FileProxy` already delegates `fileno()` (line 56-57)\
  \ and has a generic `__getattr__` fallback (line 25-26), but `isatty()` is defined\
  \ on `io.TextIOBase` in the MRO, so `__getattr__` is never reached for it.\n\n###\
  \ Reproduction\n\n```python\nimport sys\nfrom rich.console import Console\nfrom\
  \ rich.live import Live\n\nconsole = Console()\nprint(\"Before Live:\", sys.stdout.isatty())\
  \  # True\n\nwith Live(\"hello\", console=console, redirect_stdout=True):\n    print(\"\
  Inside Live:\", sys.stdout.isatty())  # False (should be True)\n\nprint(\"After\
  \ Live:\", sys.stdout.isatty())  # True\n```\n\n### Impact\n\nAny code running inside\
  \ a `Live` context with `redirect_stdout=True` that branches on `isatty()` gets\
  \ the wrong answer. This is particularly problematic for applications that use `Live`\
  \ for streaming display while also executing callbacks/tools that check whether\
  \ stdout is a terminal.\n\n### Suggested fix\n\nAdd an `isatty()` method to `FileProxy`\
  \ that delegates to the underlying file, consistent with how `fileno()` is already\
  \ handled:\n\n```python\ndef isatty(self) -> bool:\n    return self.__file.isatty()\n\
  ```\n"
