prompt: "werkzeug misdecodes multipart line breaks if 64kb chunk ends in the middle\
  \ of final CR+LF\n\nThe following minimalist flask application and upload code causes\
  \ a wrongly decoded multipart payload to be saved. The application file `upload.py`\
  \  and test case `testcase` are in the attached zip file [reproducer.zip](https://github.com/user-attachments/files/23521331/reproducer.zip).\n\
  \n - run application: `mkdir upload ; python3 -m flask --app upload.py run -p 32269`\n\
  \ - upload the test case (from a separate shell, of course): `netcat 127.0.0.1 32269\
  \ < testcase`\n\nBehold the fact that the testcase ends in:\n```\n000100f0: 0000\
  \ 0000 0000 0000 0000 0000 0000 0000  ................\n00010100: 0000 0000 0000\
  \ 000d 0a2d 2d30 3633 6166  .........--063af\n00010110: 6334 6362 6534 3661 3734\
  \ 3035 3930 3938  c4cbe46a74059098\n00010120: 3831 3433 3937 3165 3262 642d 2d0d\
  \ 0a    8143971e2bd--..\n```\n\nwhereby the *payload* should end with a bunch of\
  \ zeros.\n\nWhat happens is that the downloaded file has a stray `\\x0d` at the\
  \ end, leading to a file of length 65432 bytes, while the correct length should\
  \ be 65431 bytes:\n```\n0000ff80: 0000 0000 0000 0000 0000 0000 0000 0000  ................\n\
  0000ff90: 0000 0000 0000 000d                      ........\n```\n\nMy understanding\
  \ of the cause is that the code [here](https://github.com/pallets/werkzeug/blob/main/src/werkzeug/formparser.py#L368-L370)\
  \ splits the input in chunks of size 65536. Its state machine is updated by what\
  \ it sees. If the chunk is broken in the middle of the final line break (which is\
  \ precisely what happens here), the [quite tolerant regexp here](https://github.com/pallets/werkzeug/blob/main/src/werkzeug/sansio/multipart.py#L63-L65)\
  \ will recognize a single `\\n` as a legitimate line break marker, and thus let\
  \ `\\r` be part of the payload.\n\n\nEnvironment:\n```\n>>> import werkzeug\n>>>\
  \ import sys\n>>> import importlib\n>>> from importlib.metadata import version\n\
  >>> sys.version\n'3.13.9 (main, Oct 15 2025, 14:56:22) [GCC 15.2.0]'\n>>> version('werkzeug')\n\
  '3.1.3'\n```\n\nThis bug was observed in the field with the [cado-nfs software](https://gitlab.inria.fr/cado-nfs/cado-nfs/-/issues/30119)\
  \ and nailed down by @akruppa.\n"
