  \n```\n urlize(value, trim_url_limit=None, nofollow=False, target=None)\n\n    Converts\
  \ URLs in plain text into clickable links.\n```\n\nTherefore I expect that anything\
  \ that [looks like URL](https://en.wikipedia.org/wiki/Uniform_Resource_Locator#Syntax)\
  \ gets converted to `<a href=...>` tag. Unfortunately now `urlize` picks only http\
  \ and https URLs.\n\nSomething has to be changed. Either `urlize` behaviour or documentation\
  \ to cleary describe `urlize` limitations.\n"
