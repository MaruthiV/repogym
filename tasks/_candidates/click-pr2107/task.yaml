prompt: "Usage of allow_dash flag for path parameters is not clear\n\nThe `allow_dash`\
  \ parameter to the `click.Path` type can be misleading.\r\n\r\n```\r\nallow_dash\
  \ (bool) – If this is set to True, a single dash to indicate standard streams is\
  \ permitted.\r\n```\r\n\r\nThis seems to imply that there's some special handling\
  \ of standard streams. I believe describing this parameter and linking to the `open_file`\
  \ function might be a good idea in this section:\r\n\r\nhttps://click.palletsprojects.com/en/8.0.x/arguments/#file-path-arguments\r\
  \n\r\n\r\n\r\nRunning `run.sh` will show the behaviour, which is \"correct\" (writes\
  \ to stdout) when you pass in `/dev/stdout` and \"incorrect\" (writes to a file\
  \ called `-`) when you pass in `-`.\r\n\r\nhttps://gist.github.com/ls-jad-elkik/6007156d5528f1624729c5c3ecc3e96a\r\
  \n\r\n\r\n\r\nWhen using `-` I would expect behaviour similar to `File` which automatically\
  \ interprets the `-`. It's not necessarily the \"wrong\" behaviour, just unclear\
  \ from the docs IMO.\r\n\r\nEnvironment:\r\n\r\n- Python version: 3.9.1\r\n- Click\
  \ version: 7.1.2\n"
