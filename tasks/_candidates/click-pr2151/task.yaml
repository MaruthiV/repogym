prompt: "Access untruncated help string\n\nThere's an [open feature request against\
  \ sphinx-click](https://github.com/click-contrib/sphinx-click/issues/56), asking\
  \ that we stop ignoring truncation of help strings when generating the documentation.\
  \ Unfortunately, a quick look suggests [this is not currently possible](https://github.com/click-contrib/sphinx-click/issues/56#issuecomment-988996878)\
  \ because we don't store the help string before we truncate it.\r\n\r\nThis RFE\
  \ ask that we provide some mechanism to access the raw help string. I suspect this\
  \ will involve either (a) storing the \"raw\" help string in a different attribute\
  \ or (b) storing this in the `help` attribute and truncating on load rather than\
  \ on store.\n"
