prompt: "Custom async filters not awaited for constant inputs\n\nIn async mode, if\
  \ I create a custom async filter, it works correctly when called on data passed\
  \ by `render`, but not on constants in the template itself. See code below.\r\n\r\
  \n---\r\n\r\n## Expected Behavior\r\nprint\r\n```\r\nHello test1\r\nHello test2\r\
  \n```\r\n\r\n## Actual Behavior\r\nprint\r\n```\r\n<coroutine object myfilter at\
  \ 0x7f89c7a393c0>\r\nHello test2\r\n```\r\n\r\n## Template Code\r\n```python\r\n\
  import asyncio\r\nimport jinja2\r\n\r\n\r\nasync def myfilter(instr):\r\n    return\
  \ f'Hello {instr}'\r\n\r\n\r\nasync def main():\r\n\r\n    env = jinja2.Environment(enable_async=True)\r\
  \n    env.filters['myfilter'] = myfilter\r\n\r\n    tmpl = env.from_string('{{\"\
  test1\"|myfilter}}\\n{{x|myfilter}}')\r\n\r\n    text = await tmpl.render_async(x='test2')\r\
  \n    print(text)\r\n\r\n\r\nif __name__ == '__main__':\r\n    asyncio.run(main())\r\
  \n```\r\n\r\n## Your Environment\r\n* Python version: 3.8.2\r\n* Jinja version:\
  \ 2.11.2\n"
