prompt: "No way to alter dynamic default value help text representation\n\nBefore\
  \ 78a62b37c956e71b32689a0d5c75a684aa9ab56d it was possible to pass a default value\
  \ in a form of a callable object with `__str__` defined. An object's string representation\
  \ made its way to the help text - a behavior which was actually a feature. Now it's\
  \ always just `(dynamic)` which is fine for simple functions, but not very useful\
  \ and limiting in case of callable objects. To showcase that this can be actually\
  \ a useful feature, an example:\r\n\r\n```py\r\nclass EnvDefault:\r\n    \"\"\"\
  A default which shows the actual value of an environment variable\r\n    in the\
  \ help text. This is different from envvar=.\r\n    \"\"\"\r\n    def __init__(self,\
  \ envvar, default):\r\n        self.envvar = envvar\r\n        self.default = default\r\
  \n    def __call__(self):\r\n        return os.environ.get(self.envvar, self.default)\r\
  \n    def __str__(self):\r\n        return str(self())\r\n```\n"
