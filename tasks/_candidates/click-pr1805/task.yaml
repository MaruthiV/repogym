prompt: "Traceback when CLI option has bad default could be more helpful\n\n### Expected\
  \ Behavior\r\n\r\nIn the following command, I add an option `--multiple` with the\
  \ metadata `multiple=True`, but the default `False` instead of `[False]`.\r\n\r\n\
  Ideally, the traceback should indicate that the `--multiple` option has a bad default.\r\
  \n\r\n```python\r\n#!/usr/bin/env python\r\nimport click\r\n\r\n@click.command()\r\
  \n@click.option(\"--multiple\", multiple=True, default=False, show_default=True)\r\
  \ndef cli(debug):\r\n    pass\r\n\r\nif __name__ == '__main__':\r\n    cli()\r\n\
  ```\r\n\r\n### Actual Behavior\r\n\r\nTell us what happens instead.\r\n\r\n```pytb\r\
  \nTraceback (most recent call last):\r\n  File \"./test_click.py\", line 12, in\
  \ <module>\r\n    cli()\r\n  File \"/home/user/anaconda3/envs/pybids-pre/lib/python3.8/site-packages/click/core.py\"\
  , line 1025, in __call__\r\n    return self.main(*args, **kwargs)\r\n  File \"/home/user/anaconda3/envs/pybids-pre/lib/python3.8/site-packages/click/core.py\"\
  , line 954, in main\r\n    with self.make_context(prog_name, args, **extra) as ctx:\r\
  \n  File \"/home/user/anaconda3/envs/pybids-pre/lib/python3.8/site-packages/click/core.py\"\
  , line 852, in make_context\r\n    self.parse_args(ctx, args)\r\n  File \"/home/user/anaconda3/envs/pybids-pre/lib/python3.8/site-packages/click/core.py\"\
  , line 1261, in parse_args\r\n    value, args = param.handle_parse_result(ctx, opts,\
  \ args)\r\n  File \"/home/user/anaconda3/envs/pybids-pre/lib/python3.8/site-packages/click/core.py\"\
  , line 2078, in handle_parse_result\r\n    value, source = self.consume_value(ctx,\
  \ opts)\r\n  File \"/home/user/anaconda3/envs/pybids-pre/lib/python3.8/site-packages/click/core.py\"\
  , line 2509, in consume_value\r\n    value, source = super().consume_value(ctx,\
  \ opts)\r\n  File \"/home/user/anaconda3/envs/pybids-pre/lib/python3.8/site-packages/click/core.py\"\
  , line 1975, in consume_value\r\n    value = self.get_default(ctx)\r\n  File \"\
  /home/user/anaconda3/envs/pybids-pre/lib/python3.8/site-packages/click/core.py\"\
  , line 2453, in get_default\r\n    return super().get_default(ctx, call=call)\r\n\
  \  File \"/home/user/anaconda3/envs/pybids-pre/lib/python3.8/site-packages/click/core.py\"\
  , line 1957, in get_default\r\n    return self.type_cast_value(ctx, value)\r\n \
  \ File \"/home/user/anaconda3/envs/pybids-pre/lib/python3.8/site-packages/click/core.py\"\
  , line 2007, in type_cast_value\r\n    return _convert(value, (self.nargs != 1)\
  \ + bool(self.multiple))\r\n  File \"/home/user/anaconda3/envs/pybids-pre/lib/python3.8/site-packages/click/core.py\"\
  , line 2005, in _convert\r\n    return tuple(_convert(x, level - 1) for x in value)\r\
  \nTypeError: 'bool' object is not iterable\r\n```\r\n\r\nI discovered this while\
  \ running tests on pre-released dependencies, picking up click 8.0.0a1, which no\
  \ longer accepts the above. The offending case was in a subcommand with many options,\
  \ so it was not as obvious as it would be with a good error message.\r\n\r\n###\
