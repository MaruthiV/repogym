prompt: "Error in click.utils.echo() when console is unavailable\n\nThe `click.utils.echo()`\
  \ function does not seem to account for the case when the console is not available\
  \ on Windows, i.e., when running under `pythonw.exe` interpreter instead of the\
  \ `python.exe` one.\r\n\r\nMinimal example: \r\n\r\n```python\r\n# program.py\r\n\
  import sys\r\nimport os\r\n\r\ntry:\r\n    import click\r\n    click.utils.echo(\"\
  Hello world\")\r\nexcept Exception:\r\n    import traceback\r\n    error_file =\
  \ os.path.join(os.path.dirname(__file__), \"error_log.txt\")\r\n    with open(error_file,\
  \ \"w\") as fp:\r\n        traceback.print_exc(file=fp)\r\n```\r\n\r\nRunning this\
  \ program with `pythonw.exe program.py` produces the `error_log.txt`:\r\n``` \r\n\
  Traceback (most recent call last):\r\n  File \"C:\\Users\\Rok\\Development\\pyi-click\\\
  program.py\", line 6, in <module>\r\n    click.utils.echo(\"Hello world\")\r\n \
  \ File \"C:\\Users\\Rok\\Development\\pyi-click\\venv\\lib\\site-packages\\click\\\
  utils.py\", line 299, in echo\r\n    file.write(out)  # type: ignore\r\nAttributeError:\
  \ 'NoneType' object has no attribute 'write'\r\n```\r\n\r\nIn contrast, standard\
  \ `print()` function gracefully handles situations when console is unavailable and\
  \ `sys.stdout` and `sys.stderr` are `None`.\r\n\r\nThis attempt at retrieving stdout/stderr:\r\
  \nhttps://github.com/pallets/click/blob/c65c6ad18471448c0fcc59ef53088787288c02cc/src/click/utils.py#L250-L254\r\
  \nshould be followed by another `None` check, and if the stream is unavailable,\
  \ the function should become a no-op (exit immediately).\r\n\r\nEnvironment:\r\n\
  \r\n- OS: Windows\r\n- Python version: any\r\n- Click version: 8.1.3 (and earlier)\n"
