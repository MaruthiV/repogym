  \ = True                                                          │\r\n│   legacy_windows\
  \ = False                                                         │\r\n│       \
  \  no_color = False                                                         │\r\n\
  │          options = ConsoleOptions(                                           \
  \    │\r\n│                        size=ConsoleDimensions(width=118, height=30),\
  \             │\r\n│                        legacy_windows=False,              \
  \                       │\r\n│                        min_width=1,             \
  \                                 │\r\n│                        max_width=118, \
  \                                           │\r\n│                        is_terminal=True,\
  \                                         │\r\n│                        encoding='utf-8',\
