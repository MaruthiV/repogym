prompt: "[BUG] Need better detection of terminal color capabilities\n\n**Describe\
  \ the bug**\r\nThe terminal 'rxvt-unicode-256color' is not correctly identified\
  \ as having 256 color support, because the code doesn't expect the base terminal\
  \ name (rxvt-unicode) to have a hyphen (https://github.com/willmcgugan/rich/blob/master/rich/console.py#L773).\r\
  \n\r\n**To Reproduce**\r\nRun urxvt from the rxvt-unicode-256 package.\r\n\r\n**Platform**\r\
  \nLinux\r\n\r\n**Diagnose**\r\n```\r\n$ python -m rich.diagnose\r\n│ color_system\
  \ = 'standard' │\r\n│   is_interactive = True   │\r\n│      is_terminal = True \
  \  │\r\n│         no_color = False  |\r\n$ python -m rich._windows\r\nplatform=\"\
  Linux\"\r\nWindowsConsoleFeatures(vt=False, truecolor=False)\r\n$ pip freeze | grep\
  \ rich\r\nrich==8.0.0\r\n```\r\n\r\n**Recommendation**\r\nQuery the terminal capabilities\
  \ more directly, e.g.:\r\n```\r\ntry:\r\n    import curses\r\n    curses.setupterm()\r\
  \n    num_colors = curses.tigetnum('colors')\r\nexcept ModuleNotFoundError:\r\n\
  \    pass\r\n```\n"
