prompt: "[BUG] `Syntax` wrapping doesn't account for padding\n\n- [x] I've checked\
  \ [docs](https://rich.readthedocs.io/en/latest/introduction.html) and [closed issues](https://github.com/Textualize/rich/issues?q=is%3Aissue+is%3Aclosed)\
  \ for possible solutions.\n- [x] I can't find my issue in the [FAQ](https://github.com/Textualize/rich/blob/master/FAQ.md).\n\
  \n**Describe the bug**\n\nI originally discovered this issue in Textual, but it\
  \ looks like a possible bug in `Syntax`.\n\nHere's a MRE with a narrow console width\
  \ to demonstrate. The first syntax with wrapping enabled works as expected, however\
  \ notice that the syntax with padding is missing some code:\n\n```python\nfrom rich.console\
  \ import Console\nfrom rich.syntax import Syntax\n\nEXAMPLE_CODE = \"\"\"\\\nclass\
  \ ListViewExample(App):\n    def compose(self) -> ComposeResult:\n        yield\
  \ ListView(\n            ListItem(Label(\"One\")),\n            ListItem(Label(\"\
  Two\")),\n            ListItem(Label(\"Three\")),\n        )\n        yield Footer()\\\
  \n\"\"\"\n\nconsole = Console(width=32)\n\nconsole.print(\"Syntax with wrapping\
  \ enabled:\", style=\"bold\")\nsyntax = Syntax(EXAMPLE_CODE, lexer=\"python\", word_wrap=True)\n\
  console.print(syntax)\nconsole.print()\n\nconsole.print(\"After adding padding:\"\
  , style=\"bold\")\nsyntax.padding = (1, 2)\nconsole.print(syntax)\n```\n\nTested\
  \ with the latest version of rich (14.0.0) on Linux.\n"
