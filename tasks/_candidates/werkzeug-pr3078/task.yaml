prompt: "DebugApplication(..., pin_security=False) no longer works\n\nStarting with\
  \ werkzeug 3.1.4, passing `pin_security=False` to `DebugApplication()` raises an\
  \ exception:\n\n```\nfrom django.core.wsgi import get_wsgi_application\n\nfrom werkzeug.debug\
  \ import DebuggedApplication\n\napplication = DebuggedApplication(get_wsgi_application(),\
  \ evalex=True, pin_security=False)\n```\n\n```\n  File \"/home/<redacted>/code/<redacted>/wsgi.py\"\
  , line 6, in <module>\n    application = DebuggedApplication(get_wsgi_application(),\
  \ evalex=True, pin_security=False)\n                  ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\n\
  \  File \"/home/<redacted>/.virtualenvs/<redacted>/lib/python3.12/site-packages/werkzeug/debug/__init__.py\"\
  , line 303, in _\n_init__\n    self.pin = None\n    ^^^^^^^^\n  File \"/home/<redacted>/.virtualenvs/<redacted>/lib/python3.12/site-packages/werkzeug/debug/__init__.py\"\
  , line 323, in p\nin\n    del self._pin\n        ^^^^^^^^^\nAttributeError: 'DebuggedApplication'\
  \ object has no attribute '_pin'\n```\n\n\n\nEnvironment:\n\n- Python version: \
  \ 3.12\n- Werkzeug version:  3.1.4\n\nAppears to have been introduced by https://github.com/pallets/werkzeug/commit/0c49ff0649ded8b587dc7323a5e47dfffcabc3bc#diff-83867b1c4c9b75c728654ed284dc98f7c8d4e8bd682fc31b977d122dd045178a\n"
