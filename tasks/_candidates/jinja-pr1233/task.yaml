prompt: "{% block <name> required %}\n\nThis is a feature request for blocks which\
  \ are required to be implemented by the leaf template. One example of where this\
  \ would be useful is in title blocks. In the parent template:\r\n\r\n```jinja\r\n\
  {% block title required %}{% endblock %}\r\n```\r\n\r\nAnd in the child:\r\n\r\n\
  ```jinja\r\n{% extends \"example.html\" %}\r\n{% block title %}\r\n<title>My Page</title>\r\
  \n{% endblock %}\r\n```\r\n\r\nIf the title block is not present in the latter,\
  \ an error is rased. If the block has any contents other than whitespace or comments\
  \ in the former, an error is raised. In effect, this requires all pages to have\
  \ titles.\n"
