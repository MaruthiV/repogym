prompt: "Add block syntax for pgettext\n\nFollow up on #441, #1126\r\n\r\nIt was difficult\
  \ to come to an agreement on the syntax for block translation with context, so it\
  \ was left out of #1126. However this should still be added.\r\n\r\nThe possibilities\
  \ that were discussed are:\r\n\r\n* `context` keywords: `{% trans context \"mycontext\"\
  \ num=3 %}One Text{% pluralize %}{{num}} Texts{% endtrans%}`\r\n  * [This resembles\
  \ what Django uses](https://docs.djangoproject.com/en/3.1/topics/i18n/translation/#translate-template-tag)\r\
  \n* `{% context %}` block: `{% trans %}Click me{% context %}In annoying popup{%\
  \ endtrans %}` (similar to `{% pluralize %}`\r\n  * But context is usually very\
  \ short, using a block might be wasteful\r\n* Adding on `trans` directly: `{% trans\
  \ \"greeting\" %}Hello{% endtrans %}` or `{% trans(greeting) %}Hello{% endtrans\
  \ %}`\r\n\r\nI personally don't feel strongly at all, but I really could use such\
  \ a syntax.\n"
