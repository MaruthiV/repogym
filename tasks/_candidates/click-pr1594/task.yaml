prompt: "Duplicate Boolean flag options \"--foo/--foo\" are not detected (defaults\
  \ to False)\n\nI ran into an issue where I had the code:\r\n\r\n    @click.option(\
  \ \"--print-verbose-info/--print-verbose-info\", help=\"...\", default=False )\r\
  \n\r\n...and running `cli.py --print-verbose-info` was apparently defaulting over\
  \ to the `False` value.  Totally my mistake (it should have been `--no-print-verbose-info`),\
  \ but it'd be nice to get a warning/error for boolean values which match exactly\
  \ (ie: cannot be set to true).\r\n\r\nIt was kindof tricky to diagnose b/c I assumed\
  \ that the `--print-verbose-info` that I was passing on the CLI was triggering the\
  \ `True` path, not the `False` path, and usually Click option parsing is pretty\
  \ bulletproof so it took a while to find that copy/paste problem.\r\n\r\nThis would\
  \ be a `good-first-issue`, I'm submitting it now more as a reminder to maybe follow-up\
  \ on it and figure out the appropriate P.R.\n"
