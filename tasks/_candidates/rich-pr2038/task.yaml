prompt: "[BUG] `rich.print_json()` produces incorrect syntax highlighting with `indent=None`\n\
  \n**Describe the bug**\r\n\r\nWhen using the `indent=None` parameter to `rich.print_json()`,\
  \ it results in incorrect highlighting.\r\n\r\nMinimal example:\r\n```py\r\ndata\
  \ = {\"items\": [{\"name\": \"apple\", \"count\": 1}]}\r\nrich.print_json(data=data)\
  \  # Good\r\nrich.print_json(data=data, indent=None)  # Bad\r\n```\r\n\r\nScreenshot:\r\
  \n\r\n\r\n**Platform**\r\n<details>\r\n<summary>Click to expand</summary>\r\n\r\n\
