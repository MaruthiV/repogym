prompt: "[BUG] Chunks of text go missing when writing Asian text (wrapping issue)\n\
  \n### Description\r\n\r\n(Originally reported in Textual: https://github.com/Textualize/textual/issues/3567)\r\
  \n\r\nWhen you print Asian text (specifically Chinese and Japanese, which do not\
  \ use spaces), portions of the text go missing, making it unreadable.\r\n\r\nThis\
  \ seems to be related to wrapping, as the characters which go missing are at the\
  \ end of a line.\r\nInstead of being wrapped on to a new line, they disappear.\r\
  \n\r\nThere are [rules for wrapping](https://en.m.wikipedia.org/wiki/Line_breaking_rules_in_East_Asian_languages)\
  \ in these languages which would take more effort to adhere to, but at the very\
  \ least, text should not go missing when printed.\r\n\r\n### Examples\r\n\r\nFor\
  \ example, running the snippet below, the `7` in `1670` disappears:\r\n\r\n```python\r\
  \nfrom rich.console import Console\r\nconsole = Console(width=20)\r\nconsole.print(\"\
  アプリケーションは1670万色を使用でき\")\r\n```\r\n\r\nOutput:\r\n\r\n```\r\nアプリケーションは16\r\n0万色を使用でき\r\
  \n```\r\n\r\nAnd in many cases, like those reported in this issue, multiple characters\
  \ disappear:\r\n\r\n```python\r\nfrom rich.console import Console\r\nconsole = Console(width=20)\r\
  \nconsole.print(\"TextualはPythonの高速アプリケーション開発フレームワークです\")\r\n```\r\n\r\nOutput:\r\
  \n\r\n```\r\nTextualはPy\r\nthonの高速アプリ\r\nケーション開発フレー\r\n```\r\n\r\nNotice that many\
  \ of the characters at the end of the text are completely missing (`ムワークです`).\n"
