prompt: "[BUG] Background color carries over onto the following line when soft wrapping\
  \ is enabled.\n\n- [x] I've checked [docs](https://rich.readthedocs.io/en/latest/introduction.html)\
  \ and [closed issues](https://github.com/Textualize/rich/issues?q=is%3Aissue+is%3Aclosed)\
  \ for possible solutions.\n- [x] I can't find my issue in the [FAQ](https://github.com/Textualize/rich/blob/master/FAQ.md).\n\
  \n\n\n**Describe the bug**\n\nWhen printing text with a background color and soft\
  \ wrapping enabled, the background color incorrectly carries over onto the following\
  \ line. This means an ANSI reset isn't being placed before the newline.\n\nThis\
  \ issue does not occur when `soft_wrap` is set to `False`.\n\nHere is code to reproduce\
  \ it.\n\n**Note:** To visually reproduce this issue, you must run the code with\
  \ your prompt at the bottom of the terminal window, forcing the terminal to scroll.\n\
  \n```Python\nfrom rich.console import Console\n\nconsole = Console()\n\n# Print\
  \ with soft_wrap enabled. The background color carries over to the next line.\n\
  console.print(\"soft wrap is on\", style=\"blue on white\", soft_wrap=True)\nconsole.print(\"\
  still has background color from previous line\")\n\nconsole.print()\n\n# Print with\
  \ soft_wrap disabled. The background color does not carry over.\nconsole.print(\"\
  soft wrap is off\", style=\"blue on white\", soft_wrap=False)\nconsole.print(\"\
  correctly has no color from previous line\")\n```\n\nHere is a screenshot of the\
  \ behavior.\n\n<img width=\"575\" height=\"99\" alt=\"Image\" src=\"https://github.com/user-attachments/assets/e7b55a01-9199-49a8-b7cf-168d46eb73ed\"\
  \ />\n\n**Platform**\n<details>\n<summary>Click to expand</summary>\n\nWhat platform\
  \ (Win/Linux/Mac) are you running on? What terminal software are you using?\nLinux\n\
