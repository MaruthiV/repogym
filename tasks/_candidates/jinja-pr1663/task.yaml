prompt: "Add searchpath to TemplateNotFound exception message\n\nThis was from https://github.com/apache/airflow/issues/23333\
  \ where trying to load a template that doesn't exist in the searchpath raises `TemplateNotFound`\
  \ exception. In this case an absolute path is used which causes issue over concatenation\
  \ but including `searchpath` might be a useful addition so that user can know under\
  \ the paths under which the template was searched for and will be helpful during\
  \ debugging.\r\n\r\nhttps://github.com/pallets/jinja/blob/6f79daafe868b8ef20baecdcb45d12299529ed2e/src/jinja2/loaders.py#L218\r\
  \n\r\nCurrent exception :\r\n\r\n```\r\njinja2.exceptions.TemplateNotFound: /tmp/a/python_template_exts.txt\r\
  \n```\r\n\r\nProposed exception to include searchpath :\r\n\r\n```\r\njinja2.exceptions.TemplateNotFound:\
  \ /tmp/a/python_template_exts.txt not found in search path ['/opt/airflow/tests/operators',\
  \ '/']\r\n```\n"
