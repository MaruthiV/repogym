prompt: "Unable to allow empty str in prompt when confirmation_prompt=True\n\nWhen\
  \ you use the `click.prompt()` method and you specify `confirmation_prompt=True`,\
  \ there is no way to allow the user to just hit ENTER (empty str).\r\n\r\n```python\r\
  \npassphrase = click.prompt(\r\n    \"Create Passphrase\",\r\n    hide_input=True,\r\
  \n    confirmation_prompt=True,\r\n    default=\"\"\r\n)\r\n```\r\n\r\nHit ENTER\
  \ for the first passphrase. Then, when it asks you to confirm, hit ENTER again.\r\
  \nIt repeats forever and never lets you exit.\r\n\r\nAfter hitting ENTER the second\
  \ time, I expect it to save return `\"\"` as the user's prompt answer.\r\n\r\nEnvironment:\r\
  \n\r\n- Python version: 3.9.7\r\n- Click version: 8.0.3\n"
