source: mined
prompt: "don't type cast when getting default\n\nClick 8 changed the processing pipeline\
  \ in an effort to be more consistent. Part of that made fetching the default value\
  \ happen in the same area of code as fetching the value from other sources, then\
  \ processing whatever value was fetched. However, `get_default` still calls `type_cast_value`,\
  \ which was a holdover from the previous code.\r\n\r\nThis causes default values\
  \ to be type cast twice, once when fetching the default value, then again when processing\
  \ the value. It also causes the default to be type cast when showing the help text,\
  \ which can lead to unexpected output, such as the string representation of an open\
  \ file object instead of the filename.\r\n\r\nIn general, custom parameter types\
  \ *should* still be able to handle being passed a value of the correct type. This\
  \ can still happen if the default is the correct type, or when prompting (which\
  \ converts the value to the type for validation before returning), or when passing\
  \ arguments to `main()` from Python instead of the command line.\r\n\r\nFetching\
  \ the default value should behave more like the other source handled in `consume_value`.\
  \ Env vars and context defaults are not type cast, so the default should not be\
  \ either. This should prevent the most common source of issues with existing custom\
  \ types (although they should still be updated to work as described above).\r\n\r\
  \nRelated to:\r\n\r\n- #1898\r\n- #1951\r\n- #1976\r\n- #1999\r\n- #2035\r\n- #2081\r\
  \n\r\nThere are still some other unexpected behaviors, such as type casting `flag_value`,\
  \ but that will have to be handled separately.\n"
