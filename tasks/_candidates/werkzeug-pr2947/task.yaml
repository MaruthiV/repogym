prompt: "watchdog: Prevent reload if a file gets closed without any changes\n\n**What's\
  \ the issue?**\r\n\r\n[watchdog 5.0](https://github.com/gorakhargosh/watchdog/blob/master/changelog.rst#500)\
  \ introduced a [new signal that is fired when a file gets closed without any changes\
  \ written](https://github.com/gorakhargosh/watchdog/pull/1059).  \r\nThis leads\
  \ to random reloads when something opens and closes a file. `opened` events are\
  \ already ignored, so we should ignore the new `closed_no_write` events too.\r\n\
  \r\n**How to reproduce?**\r\n\r\nUpdate to watchdog 5.0+ and wait for the reloads\
  \ to come in.\r\n\r\n**What's the expected behavior?**\r\n\r\nWerkzeug should only\
  \ reload if there are actual changes to the code base.\r\n\r\n**Environment**\r\n\
  \r\n- Python version: 3.11.2\r\n- Werkzeug version: 3.0.4\r\n- watchdog version:\
  \ 5.0.2\n"
