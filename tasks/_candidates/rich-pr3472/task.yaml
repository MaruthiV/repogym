  \n\r\n**Describe the bug**\r\n\r\nObjects in pretty traceback printing which are\
  \ `dataclass` objects with fields that are specified with `init=False` will cause\
  \ an uncaught exception in the printing. See below.\r\n\r\n```py\r\nfrom dataclasses\
