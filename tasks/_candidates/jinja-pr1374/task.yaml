prompt: "TypeError: unhashable type: 'Config' (regression)\n\nWhen installing the\
  \ current git master of jinja, with a trivial Flask application:\r\n\r\n```python\r\
  \nimport flask\r\n\r\napp = flask.Flask(__name__)\r\n\r\n@app.route('/')\r\ndef\
  \ test():\r\n    return flask.render_template('test.html')\r\n```\r\n\r\nand then:\r\
  \n\r\n- Creating an empty `template/test.html`\r\n- Running `FLASK_APP=test flask\
  \ run`\r\n- Loading the page and reloading it in the browser\r\n\r\nThis happens:\r\
  \n\r\n```pytb\r\nTraceback (most recent call last):\r\n  File \".../site-packages/flask/app.py\"\
  , line 2447, in wsgi_app\r\n    response = self.full_dispatch_request()\r\n  File\
  \ \".../site-packages/flask/app.py\", line 1952, in full_dispatch_request\r\n  \
  \  rv = self.handle_user_exception(e)\r\n  File \".../site-packages/flask/app.py\"\
  , line 1821, in handle_user_exception\r\n    reraise(exc_type, exc_value, tb)\r\n\
  \  File \".../site-packages/flask/_compat.py\", line 39, in reraise\r\n    raise\
  \ value\r\n  File \".../site-packages/flask/app.py\", line 1950, in full_dispatch_request\r\
  \n    rv = self.dispatch_request()\r\n  File \".../site-packages/flask/app.py\"\
  , line 1936, in dispatch_request\r\n    return self.view_functions[rule.endpoint](**req.view_args)\r\
  \n  File \".../test.py\", line 7, in test\r\n    return flask.render_template('test.html')\r\
  \n  File \".../site-packages/flask/templating.py\", line 138, in render_template\r\
  \n    ctx.app.jinja_env.get_or_select_template(template_name_or_list),\r\n  File\
  \ \".../site-packages/jinja2/environment.py\", line 898, in get_or_select_template\r\
  \n    return self.get_template(template_name_or_list, parent, globals)\r\n  File\
  \ \".../site-packages/jinja2/environment.py\", line 851, in get_template\r\n   \
  \ return self._load_template(name, self.make_globals(globals))\r\n  File \".../site-packages/jinja2/environment.py\"\
  , line 815, in _load_template\r\n    new_globals = globals.items() - template.globals.items()\r\
  \nTypeError: unhashable type: 'Config'\r\n```\r\n\r\nThis is caused by #1244 / 40a312e80f4f1b25f201293c3f1a840a1b88191d\
  \ - the commit before that (f71f5ebab2e76c5ee6f5f705a2703f3891e762bc) works fine.\
  \ Reproducible with Python 3.6.13, 3.7.10, 3.8.8 and 3.9.2.\n"
