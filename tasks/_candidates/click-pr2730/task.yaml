prompt: "Flag option with secondary opts: show_default=True does not show value from\
  \ default_map in \"help\" output\n\nI'm setting the `default_map` from a config\
  \ file, and it seems the values from the `default_map` are not correctly shown in\
  \ the `--help` output if I set `show_default=True` on my option.\r\n\r\nMy Option\
  \ looks like this:\r\n\r\n```python\r\n@click.option(\r\n    \"--long/--short\"\
  ,\r\n    \"-l/-s\",\r\n    is_flag=True,\r\n    show_default=True,\r\n    help=\"\
  show additional information like size and creation date\",\r\n)\r\n```\r\n\r\nI\
  \ initialize the `default_map` with a custom command class that I attach via the\
  \ `@click.command` decorator like this `@click.command(cls=ConfigAwareCommand)`\r\
  \n\r\n```python\r\nfrom click import Command as _Command\r\n\r\n\r\nclass ConfigAwareCommand(_Command):\r\
  \n    def __init__(self, *args, **kwargs):\r\n        kwargs[\"context_settings\"\
  ] = {\r\n            \"default_map\": CONFIG.get_cli_command_defaults(kwargs[\"\
  name\"])\r\n        }\r\n        super().__init__(*args, **kwargs)\r\n\r\n```\r\n\
  \r\nThe `default_map` value is in my example `{'long': True}`. In the `--help` output,\
  \ the default value is shown like this\r\n\r\n```\r\n  -l, --long / -s, --short\
  \        show additional information like size and\r\n                         \
  \         creation date  [default: short]\r\n```\r\n\r\nWhen executing the command,\
  \ the default value from the `default_map` is used correctly (`long` defaults to\
  \ `True`).\r\n\r\nDuring debugging, I might have found the culprit inside [src/click/core.py](https://github.com/pallets/click/blob/main/src/click/core.py#L2746)\r\
  \n\r\n```python\r\n            elif self.is_bool_flag and self.secondary_opts:\r\
  \n                # For boolean flags that have distinct True/False opts,\r\n  \
  \              # use the opt without prefix instead of the value.\r\n          \
  \      default_string = _split_opt(\r\n                    (self.opts if self.default\
  \ else self.secondary_opts)[0]\r\n                )[1]\r\n```\r\n\r\nAs you can\
  \ see, `self.default` is used instead of the `default_value` variable that is initialized\
  \ [further above](https://github.com/pallets/click/blob/main/src/click/core.py#L2720)\
  \ this code snippet.\r\n\r\nIf I change the part of the code above and use `default_value`\
  \ instead of `self.default` the help output shows the correct default values from\
  \ the `default_map`.\r\n\r\n```python\r\n            elif self.is_bool_flag and\
  \ self.secondary_opts:\r\n                # For boolean flags that have distinct\
  \ True/False opts,\r\n                # use the opt without prefix instead of the\
  \ value.\r\n                default_string = _split_opt(\r\n                   \
  \ (self.opts if default_value else self.secondary_opts)[0]\r\n                )[1]\r\
  \n```\r\n\r\nI am not sure if I do something wrong or if this is indeed a bug.\r\
  \n\r\nEnvironment:\r\n\r\n- Python version: 3.10.12\r\n- Click version: 8.1.7\n"
