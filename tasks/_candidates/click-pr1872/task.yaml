prompt: '`HelpFormatter.write_text()` is not using all the available line width


  `HelpFormatter.write_text()` uses the function `wrap_text(text, width, initial_indent,
  ...)` internally. This function expects `width` to be the line width **including**
  the eventual indentation. `HelpFormatter.write_text()` gets this wrong and passes
  `self.width - self.current_indent` instead of just `self.width`.

  '
