prompt: "Bug: Optional value not optional anymore\n\n### Outline\n\nAs stated in [official\
  \ documentation](https://click.palletsprojects.com/en/stable/options/#optional-value):\
  \ \n> Setting `is_flag=False, flag_value=value` tells Click that the option can\
  \ still be passed a value, but if only the flag is given, the value will be `flag_value`.\n\
  \nSince 8.3.0 this doesn't work anymore, instead `SystemExit` with \"Error: Option\
  \ '--xyz' requires an argument.\" is thrown.\n\n### Replication of bug\n\nExample\
  \ taken from documentation:\n```python\n@click.command()\n@click.option(\"--name\"\
  , is_flag=False, flag_value=\"Flag\", default=\"Default\")\ndef hello(name):\n \
  \   click.echo(f\"Hello, {name}!\")\n```\n\n```shell\n$ hello --name\nError: Option\
  \ '--name' requires an argument.\n```\n\n### Expected behavior\n\nThe code example\
  \ above should work as\n```shell\n$ hello --name\nHello, Flag!\n```\n\nIt's not\
  \ even working in the generated documentation anymore: while [documentation up to\
  \ Sep, 10th](https://web.archive.org/web/20250910222023/https://click.palletsprojects.com/en/stable/options/#optional-value)\
  \ shows the expected and correct behavior, [current documentation](https://click.palletsprojects.com/en/stable/options/#optional-value)\
  \ demonstrates the bug.\n\n- Python version: 3.11\n- Click version: 8.3.0\n"
