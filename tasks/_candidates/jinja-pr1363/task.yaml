prompt: "Async support does not work with Native environment\n\nHi, \r\n\r\nWe have\
  \ been starting to porting existing Flask code to an asyncio based server (Quart).\r\
  \nPart of it makes use of the Jinja Native environment.\r\n\r\nThe render_async\
  \ works very well, but not in conjunction with Native.\r\n\r\nHere is replicable\
  \ code in a `python -m asyncio` console:\r\n\r\n```python\r\nfrom jinja2.nativetypes\
  \ import NativeEnvironment\r\n\r\ndef render(s, my_vars):\r\n    native_environment\
  \ = NativeEnvironment()\r\n    template = native_environment.from_string(s)\r\n\
  \    return template.render(**my_vars)\r\n\r\n\r\nasync def render_async(s, my_vars):\r\
  \n    native_environment = NativeEnvironment(enable_async=True)\r\n    template\
  \ = native_environment.from_string(s)\r\n    return await template.render_async(**my_vars)\r\
  \n\r\nglobal_vars = {}\r\n\r\nnumber_list = [1, 2, 3, 4, 5, 6, 7, 8, 9]\r\nglobal_vars[\"\
  number_list\"] = number_list\r\n\r\nout = render(\"{{35}}\", global_vars)\r\n# int:\
  \ 35\r\n\r\nout = await render_async(\"{{35}}\", global_vars)\r\n# str: '35'\r\n\
  \r\n\r\nout = render(\"{{number_list}}\", global_vars)\r\n# list: [1, 2, 3, 4, 5,\
  \ 6, 7, 8, 9]\r\n\r\nout = await render_async(\"{{number_list}}\", global_vars)\r\
  \n# Traceback (most recent call last):\r\n#   File \"/Users/A492YC/.pyenv/versions/3.8.1/lib/python3.8/concurrent/futures/_base.py\"\
  , line 439, in result\r\n#     return self.__get_result()\r\n#   File \"/Users/A492YC/.pyenv/versions/3.8.1/lib/python3.8/concurrent/futures/_base.py\"\
  , line 388, in __get_result\r\n#     raise self._exception\r\n#   File \"<console>\"\
  , line 1, in <module>\r\n#   File \"<console>\", line 4, in render_async\r\n#  \
  \ File \"/Users/A492YC/.virtualenvs/jinja_test-SmX6WV4i/lib/python3.8/site-packages/jinja2/asyncsupport.py\"\
  , line 65, in render_async\r\n#     return self.environment.handle_exception()\r\
  \n#   File \"/Users/A492YC/.virtualenvs/jinja_test-SmX6WV4i/lib/python3.8/site-packages/jinja2/environment.py\"\
  , line 832, in handle_exception\r\n#     reraise(*rewrite_traceback_stack(source=source))\r\
  \n#   File \"/Users/A492YC/.virtualenvs/jinja_test-SmX6WV4i/lib/python3.8/site-packages/jinja2/_compat.py\"\
  , line 28, in reraise\r\n#     raise value.with_traceback(tb)\r\n#   File \"/Users/A492YC/.virtualenvs/jinja_test-SmX6WV4i/lib/python3.8/site-packages/jinja2/asyncsupport.py\"\
  , line 26, in concat_async\r\n#     return concat(rv)\r\n# TypeError: sequence item\
  \ 0: expected str instance, list found\r\n\r\n```\r\n\r\nExpected: \r\n\r\nIn Native\
