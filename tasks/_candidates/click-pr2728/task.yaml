  ).format(\r\n_(\"{name} {filename!r} is not readable.\").format(\r\n_(\"{name} {filename!r}\
  \ is not writable.\").format(\r\n_(\"{name} {filename!r} is not executable.\").format(\r\
  \n```\n"
