  \ a request over the service, but it works when i shorten the name of the Kubernetes\
  \ service or i use POD address directly as Kubernetes health probe does.\r\n\r\n\
  ```html\r\n<!doctype html>\r\n<html lang=en>\r\n<title>400 Bad Request</title>\r\
  \n<h1>Bad Request</h1>\r\n<p>The browser (or proxy) sent a request that this server\
  \ could not understand.</p>\r\n```\r\n\r\nI added minimum app and test-case into\
  \ comments.\r\n\r\nI was able to see the actual error by setting \"TRAP_BAD_REQUEST_ERRORS\"\
  \  as described in the [comment](https://github.com/pallets/flask/blob/ea316d232a00d6c66a48a13bf36bcb9885326a55/flask/app.py#L1690).\r\
