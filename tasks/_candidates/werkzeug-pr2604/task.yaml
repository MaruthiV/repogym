prompt: "WatchdogReloaderLoop reloading on every http request due to change in watchdog\n\
  \n(Note, I'm not sure if this is an issue in werkzeug or watchdog as I think this\
  \ is an intentional change in behavior in watchdog)\r\n\r\nThe watchdog event handler\
  \ `PatternMatchingEventHandler.on_any_event()` as of 2.3.0 now includes file opened\
  \ events. This is causing the Werkzeug `WatchdogReloaderLoop` to reload whenever\
  \ a file is opened. Flask, in debug mode, uses this reloader and as a result, the\
  \ reloader has become a challenge to use as files are opened on each http request\
  \ (generally).\r\n(https://github.com/gorakhargosh/watchdog/commit/2b09f64b8b486b94f909146385418800de8841f8)\r\
  \n\r\nNote that in 2.3.1, watchdog started to ignore file open events, but only\
  \ for `Trick` event handlers (https://github.com/gorakhargosh/watchdog/commit/25a2d1fec55fc32f97055ba827c8ce7b959acb34)\r\
  \n\r\n\r\n1. Launch a simple flask server in debug mode (FLASK_DEBUG=1)\r\n2. Make\
  \ http request\r\n3. Server restarts\r\n\r\n\r\nServer should not restart on every\
  \ http request when a watchdog reloader is being used.\r\n\r\nEnvironment:\r\n\r\
  \n- Python version: 3.11.2\r\n- Werkzeug version: 2.2.3\r\n- Watchdog version: 2.3.1\
  \ and 2.3.0 (both)\n"
