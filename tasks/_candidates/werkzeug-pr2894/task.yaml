prompt: "Some relative redirect strings incorrectly bypass iri_to_uri normalization.\
  \ \n\n## Summary \r\nIt appears logic introduced in https://github.com/pallets/werkzeug/pull/2695\
  \ to work-around the `itms-services:` schema oddity has an overly broad assumption\
  \ that is results in invalid URIs due to not percent-encoding relative IRIs as intended.\
  \ \r\n\r\nUltimately, this can trick browsers into behaving badly when faced with\
  \ invalid relative URL locations. But I think it is ours to fix in werkzeug because\
  \ the current code is emitting an invalid location header per RFCs (and the presumed\
  \ intention of the code.) \r\n\r\nRFC 3986 for URIs has a [section 2](https://datatracker.ietf.org/doc/html/rfc3986#section-2.3)\
  \ that essentially says URI components should be percent-encoded if they aren't\
  \ part of the \"reserved\" or explicitly \"unreserved\" lists of characters. As\
  \ an case-study: backslashes should be percent-encoded. Indeed, werkzeug seems to\
  \ intent to encode them, but this issue describes the case where the typical encoding\
  \ logic is not being applied.\r\n\r\n## Replication\r\nAs an example consider an\
  \ app expecting to use `redirect(relative_uri)` and expecting werkzeug to properly\
  \ encode the `Location:` header (as it historically would before the mentioned work-around)\r\
  \n\r\n```python\r\nfrom werkzeug.utils import redirect\r\nproblem_relative_uri =\
  \ '/\\\\\\\\github.com?extra=data&blank=#fragment'\r\nresponse = redirect(problem_relative_uri)\r\
  \nresponse.location\r\n# '/\\\\\\\\github.com?extra=data&blank=#fragment'\r\n```\r\
  \n\r\nNote the backslashes (`\\`) in this URI are /not/ being encoded as `%5C` .\
  \ \r\n\r\nAs a smaller test case:\r\n```python\r\nfrom werkzeug.urls import iri_to_uri,\
  \ _invalid_iri_to_uri\r\nproblem_relative_uri = '/\\\\\\\\github.com?extra=data&blank=#fragment'\r\
  \n_invalid_iri_to_uri(problem_relative_uri)\r\n# '/\\\\\\\\github.com?extra=data&blank=#fragment'\r\
  \n# :-(\r\n```\r\n## Expected Behavior\r\nThe previous encoding behavior before\
  \ the wrapper was desirable\r\n```python\r\niri_to_uri(problem_relative_uri)\r\n\
  # '/%5C%5Cgithub.com?extra=data&blank=#fragment'\r\n# :-)\r\n```\r\n\r\nEnvironment:\r\
  \n\r\n- Python version: 3.12.1\r\n- Werkzeug version: 3.0.1\r\n\r\n\r\n## Relevant\
  \ Code\r\nhttps://github.com/pallets/werkzeug/blob/d3dd65a27388fbd39d146caacf2563639ba622f0/src/werkzeug/wrappers/response.py#L482-L483\r\
  \n\r\nhttps://github.com/pallets/werkzeug/blob/d3dd65a27388fbd39d146caacf2563639ba622f0/src/werkzeug/urls.py#L167-L185\n"
