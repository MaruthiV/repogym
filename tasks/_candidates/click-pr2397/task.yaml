prompt: "Issue UserWarning when overriding Parameter name\n\nWhen a command is given\
  \ multiple parameters that use the same name, a UserWarning should be fired to highlight\
  \ the conflict. Currently, the command will quietly allow one parameter to override\
  \ the names of another.\r\n\r\n(This is a slightly different problem than https://github.com/pallets/click/issues/1465.\
  \ In that issue, True and False values were given the same names within a single\
  \ parameter.)\r\n\r\n**Example of the issue:**\r\n\r\n```python\r\n@click.command()\r\
  \n@click.option(\"-a\", \"--aardvark\", is_flag=True)\r\n@click.option(\"-a\", \"\
  --avocado\", is_flag=True)\r\ndef cli(aardvark: bool = False, avocado: bool = False):\r\
  \n    if aardvark:\r\n        print(\"Animal\")\r\n    if avocado:\r\n        print(\"\
  Fruit\")\r\n```\r\n\r\nIn this scenario, the short-name, `-a`, appears ambiguous.\
  \ A warning would help the user realize the conflict they've introduced.\r\n\r\n\
  I'll also provide a pull request for consideration.\n"
