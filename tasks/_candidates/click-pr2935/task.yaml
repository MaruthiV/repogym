prompt: "Completion for commands in nested groups is broken in Click 8.2.0\n\n## Summary\n\
  \nIn Click 8.2.0, completion for commands in nested groups doesn't work as expected\
  \ anymore. Instead of completing command options and/or arguments, completion infinitely\
  \ repeats the command names for the group.\n\n## Example program\n\nInspired by\
  \ the example in #2847 \n\nSave the following as `bin/nested` in a virtualenv\n\n\
  ```python\n#!/usr/bin/env python\n\n# nested\n\nimport click\n\n\ndef _complete_arg(ctx,\
  \ _, incomplete):\n    values = [\n        \"foo\",\n        \"bar\",\n        \"\
  foobar\",\n        \"baz\",\n    ]\n    return [v for v in values if v.startswith(incomplete)]\n\
  \n@click.group\ndef main():\n    ...\n\n@main.group\ndef subgroup():\n    ...\n\n\
  @subgroup.command\n@click.option(\"--name\", help=\"Name of something.\")\n@click.argument(\"\
  arg\", shell_complete=_complete_arg)\ndef compile(name: str | None, arg: str) ->\
  \ None:\n    \"\"\"Test argument completion in nested groups.\"\"\"\n    click.echo(f\"\
  {name=} {arg=}\")\n\n\nif __name__ == \"__main__\":\n    main.main()\n```\n\nRun\
  \ `eval \"$(_NESTED_COMPLETE=bash_source nested)\"` to setup completion (for bash)\n\
  \n## Completion behavior\n\n|Prefix|8.2.0 completion suggestions (unexpected behavior)|8.1.8\
  \ completion suggestions (expected behavior)|\n|-|-|-|\n|`nested`|`subgroup`|`subgroup`|\n\
  |`nested subgroup`|`compile`|`compile`|\n|`nested subgroup compile`|`compile`|`foo\
  \     bar     foobar  baz`|\n|`nested subgroup compile f`|none|`foo     foobar`|\n\
  |`nested subgroup compile --`|`--help`|`--name  --help`|\n|`nested subgroup compile\
  \ --name=n`|`compile`|`foo     bar     foobar  baz`|\n\n## Environment\n\n- Python\
  \ version: Python 3.12.3\n- Click version: 8.2.0\n\n## Initial debugging\n\nReverting\
  \ 0ef55fda47bb3d0dece21197d81d8d72a4250e73 for `src/click/shell_completion.py` restores\
  \ the 8.1.8 completion behavior.\n\nLooking at the change, I believe that the bug\
  \ is actually caused by a simple statement reordering . IMO https://github.com/pallets/click/blob/af73ce4793bf38edf11a16e959ef0d8a0dbf6c1f/src/click/shell_completion.py#L567-L571\
  \ should be the following to preserve the 8.1.8 behavior:\n\n```python\n       \
  \             with cmd.make_context(\n                        name, args, parent=ctx,\
  \ resilient_parsing=True\n                    ) as sub_ctx:\n                  \
  \      ctx = sub_ctx\n                        args = ctx._protected_args + ctx.args\n\
  ```\n\nNote that Click 8.1.8 directly assigns `cmd.make_context()` to `ctx` in the\
  \ equivalent snippet: https://github.com/pallets/click/blob/934813e4d421071a1b3db3973c02fe2721359a6e/src/click/shell_completion.py#L530-L531\n\
  \nIn the same fashion, I believe that lines 589 and 590 should be switched in https://github.com/pallets/click/blob/af73ce4793bf38edf11a16e959ef0d8a0dbf6c1f/src/click/shell_completion.py#L581-L590\n"
