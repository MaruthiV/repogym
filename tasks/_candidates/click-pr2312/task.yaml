prompt: "Parameter decorator factories shouldn't pop `cls` from `attrs`\n\nPopping\
  \ `cls` introduces a side-effect that prevents the reuse of the returned decorator.\
  \ For example, consider the code below. The function `my_shared_argument` is a decorator\
  \ that is expected to register an argument of type `ArgumentWithHelp`. Instead,\
  \ what happens is:\r\n- the first time the decorator is used, `cls=ArgumentWithHelp`\
  \ will be popped from `attrs` -> `attrs` is now modified in-place\r\n- the following\
  \ times the decorator is used, `cls` won't be in `attrs`.\r\n\r\n```python\r\nimport\
  \ click\r\n\r\n\r\nclass ArgumentWithHelp(click.Argument):\r\n    def __init__(self,\
  \ *args, help=None, **attrs):\r\n        super().__init__(*args, **attrs)\r\n  \
  \      self.help = help\r\n\r\n\r\ndef argument_with_help(*args, cls=ArgumentWithHelp,\
  \ **kwargs):\r\n    return click.argument(*args, cls=cls, **kwargs)\r\n\r\n\r\n\
  my_shared_argument = argument_with_help(\"pippo\", help=\"very useful help\")\r\n\
  \r\n\r\n@click.command()\r\n@my_shared_argument\r\ndef foo(pippo):\r\n    print(pippo)\r\
  \n\r\n\r\n@click.command()\r\n@my_shared_argument\r\ndef bar(pippo):\r\n    print(pippo)\r\
  \n```\r\n\r\nRunning this file as it is:\r\n```python\r\nTraceback (most recent\
  \ call last):\r\n  File \"C:/Users/sboby/AppData/Roaming/JetBrains/PyCharmCE2022.1/scratches/scratch_4.py\"\
  , line 27, in <module>\r\n    def bar(pippo):\r\n  File \"H:\\Repo\\unbox\\UnboxTranslate\\\
  venv\\lib\\site-packages\\click\\decorators.py\", line 287, in decorator\r\n   \
  \ _param_memo(f, ArgumentClass(param_decls, **attrs))\r\n  File \"H:\\Repo\\unbox\\\
  UnboxTranslate\\venv\\lib\\site-packages\\click\\core.py\", line 2950, in __init__\r\
  \n    super().__init__(param_decls, required=required, **attrs)\r\nTypeError: __init__()\
  \ got an unexpected keyword argument 'help'\r\n\r\nProcess finished with exit code\
  \ 1\r\n```\r\n\r\n<strike>The `@option`  decorator is affected by the same problem\
  \ but it won't crash in a similar situation because `click.Option.__init__` ignore\
  \ extra arguments: it will just silently use `click.Option` as class.</strike>\r\
  \n\r\nThe `@option` decorator is actually not affected because `attrs` is copied.\
  \ This copy is nonetheless unnecessary, since adding `cls` to the signature of the\
  \ function would be a more straightforward solution.\r\n\r\nEnvironment:\r\n\r\n\
  - Python version: irrelevant\r\n- Click version: 8.1.3 (but all versions are affected)\n"
