prompt: "argument with nargs=-1 and envvar ignores values from command line\n\nSince\
  \ click 8.0, the value(s) provided on the command line for a nargs=-1 argument are\
  \ ignored if the argument has `envvar` set.\r\n\r\nExample:\r\n\r\n```python\r\n\
  #!/usr/bin/env python\r\nimport click\r\n\r\n@click.command()\r\n@click.argument(\"\
  foo\", nargs=-1, envvar=\"FOO\")\r\ndef cli(foo):\r\n    click.echo(foo)\r\n\r\n\
  if __name__ == \"__main__\":\r\n    cli()\r\n```\r\n\r\n```\r\n$ ./clickbug arg1\
  \ arg2\r\n()\r\n```\r\n\r\n\r\nWhen arguments are passed on the command line, the\
  \ `foo` value remains empty. Removing the `envvar` option makes it work again. Values\
  \ from the environment variable are picked up, though. Reverting to `click<8` also\
  \ fixes the problem.\r\n\r\nThe cause of the bug is possibly [here](https://github.com/pallets/click/commit/3d3ea9c64420fd8978a41ce8b4db3ac2d245849c#diff-948f9e0cc733616a6b18aa152ac6703e819fec61dd752d1efa40e5736c3bdce7):\
  \ The incoming `value` (which at this point still contains the correct arguments)\
  \ is overwritten with `None` if `nargs` is -1 and the argument has an envvar set.\r\
  \n\r\nEnvironment:\r\n\r\n- Python version: 3.8.5\r\n- Click version: 8.0.0\n"
