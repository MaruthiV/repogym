source: mined
prompt: "Response.make_conditional(..., accept_ranges=True) does not send Accept-Ranges\
  \ header early enough\n\n#1711 refactored the `_process_range_request` method. Before,\
  \ it used to set `Accept-Ranges` as the first thing it did. Now, it only sets `Accept-Ranges`\
  \ when sending a response to a Range request, which defeats the point of that header\
  \ (which is to advertise support for range requests, so it's not useful if the client\
  \ is already doing a range request).\n\nbasic repro:\n```py\n# /// script\n# dependencies\
  \ = [\n#     \"werkzeug==3.1.5\",\n# ]\n# ///\nfrom werkzeug.wrappers import Request,\
  \ Response\nfrom werkzeug.serving import run_simple\nfrom werkzeug.wsgi import wrap_file\n\
  import io\n\ndef application(environ, start_response):\n    text = b\"Hello world!\"\
  \n    wrap = wrap_file(environ, io.BytesIO(text))\n    response = Response(wrap,\
  \ mimetype='text/plain')\n    response.set_etag('test')\n    response.make_conditional(environ,\
  \ accept_ranges=True, complete_length=len(text))\n    return response(environ, start_response)\n\
  \n\nrun_simple('127.0.0.1', 5000, application)\n```\n\nwhen making a request against\
  \ this with `curl -i http://127.0.0.1:5000/`, there is no Accept-Ranges header.\
  \ It only appears when doing a range request like `curl -i http://127.0.0.1:5000/\
  \ -H \"Range: bytes=0-7\"`. Note that when changing the version constraint to `werkzeug<1.0`\
  \ (before #1711 was merged), we do see Accept-Ranges in the response to the basic\
  \ request.\n\nThe fix would be to move the setting of Accept-Ranges back to the\
  \ very beginning of `_process_range_request`.\n\nEnvironment:\n\n- Python version:\
  \ 3.13.12\n- Werkzeug version: 3.1.5\n"
