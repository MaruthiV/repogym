source: mined
prompt: "Regression in click>=8; click.Path says file doesn't exist when it does\n\
  \nhttps://github.com/pallets/click/pull/1825 seems to introduce a regression. A\
  \ script which worked with `click<8` does not work when upgraded to `click>=8`,\
  \ and the call to `os.readlink` this PR introduces seems to be the cause. I.e. it\
  \ looks like fixing symlinks in this case for old Pythons on Windows has broken\
  \ symlinks for more current Pythons on Linux, however I have not tested as thoroughly\
  \ as I should be making that claims like that!\r\n\r\nI have a kubernetes \"secret\"\
  \ (could just as easily be a configmap) and these create multiple symlinks do enable\
  \ atomic replacement of all files in a secret or config map at once. An example\
  \ secret might look like this:\r\n\r\n```\r\n# ls -lart\r\ntotal 0\r\nlrwxrwxrwx\
  \    1 root     root            14 May 20 14:12 mysecret -> ..data/mysecret\r\n\
  lrwxrwxrwx    1 root     root            31 May 20 14:12 ..data -> ..2021_05_20_14_12_50.273872148\r\
  \ndrwxr-xr-x    2 root     root           100 May 20 14:12 ..2021_05_20_14_12_50.273872148\r\
  \ndrwxrwxrwt    3 root     root           140 May 20 14:12 .\r\ndrwxr-xr-x    1\
  \ root     root            50 May 20 14:12 ..\r\n```\r\n\r\n(Yes, those files and\
  \ folders have a `..` prefix which is confusing, and no I can't make kubernetes\
  \ not do that).\r\n\r\nLets say this secret was mounted as `/foo`. Prior to https://github.com/pallets/click/pull/1825,\
  \ the code would call `os.path.realpath` on `/foo/mysecret` it would resolve the\
  \ symlink correctly and end up with `/foo/..2021_05_20_14_12_50.273872148/mysecret`\r\
  \n\r\nAfter https://github.com/pallets/click/pull/1825, it calls `os.readlink` and\
  \ gets `..data/mysecret` (not an abspath). When you call `os.path.realpath` on that\
  \ it prefixes the current directory, so if you are in `/` you get `/..data/tls.crt`.\
  \ `os.stat` on `/..data/mysecret` fails. But `os.stat` on `/foo/mysecret` does not.\
  \ So definitely a regression, and I think a wrong behaviour.\r\n\r\nI think calling\
  \ `os.readlink` is not a replacement for a proper symlink resolver. Given click\
  \ only supports Python 3.6 or later, I wonder if using `pathlib.Path(...).resolve()`\
  \ here would be a better option. It does have a Windows symlink resolver (https://github.com/python/cpython/blob/3.6/Lib/pathlib.py#L181)\
  \ and a Posix one (https://github.com/python/cpython/blob/3.6/Lib/pathlib.py#L303).\
  \ Though I don't have a Windows machine to test it out.\r\n\r\n\r\n\r\nFor a reproducer\
  \ I took the example for `click.Path` from the docs and enabled the resolve_path\
  \ and exists checks:\r\n\r\n```\r\nimport click\r\n\r\n@click.command()\r\n@click.argument('filename',\
  \ type=click.Path(exists=True, resolve_path=True))\r\ndef touch(filename):\r\n \
  \   \"\"\"Print FILENAME if the file exists.\"\"\"\r\n    click.echo(click.format_filename(filename))\r\
  \n\r\n\r\nif __name__ == '__main__':\r\n    touch()\r\n```\r\n\r\nThen I made an\
  \ empty file with a symlink pointing to it:\r\n\r\n```\r\n# mkdir tst\r\n# cd tst\r\
  \n# touch foo\r\n# ln -s foo bar\r\n# ls\r\n-rw-r--r--    1 root     root      \
  \       0 May 20 15:10 foo\r\nlrwxrwxrwx    1 root     root             3 May 20\
  \ 15:10 bar -> foo\r\n```\r\n\r\n```\r\n/ # /app/bin/python /app/test.py /tst/bar\r\
  \nUsage: test.py [OPTIONS] FILENAME\r\nTry 'test.py --help' for help.\r\n\r\nError:\
  \ Invalid value for 'FILENAME': Path '/tst/bar' does not exist.\r\n```\r\n\r\nHowever\
  \ if I downgrade click:\r\n\r\n```\r\n/ # /app/bin/pip install 'click<8'\r\nCollecting\
  \ click<8\r\n  Using cached click-7.1.2-py2.py3-none-any.whl (82 kB)\r\nInstalling\
  \ collected packages: click\r\n  Attempting uninstall: click\r\n    Found existing\
  \ installation: click 8.0.1\r\n    Uninstalling click-8.0.1:\r\n      Successfully\
  \ uninstalled click-8.0.1\r\nSuccessfully installed click-7.1.2\r\n```\r\n\r\n```\r\
  \n/ # /app/bin/python /app/test.py /tst/bar\r\n/tst/foo\r\n```\r\n\r\nBecause i'm\
  \ paranoid, i upgraded click again and confirmed the reproducer fails again. It\
  \ does.\r\n\r\n\r\n\r\nEnvironment:\r\n\r\n- Linux (Alpine)\r\n- Python version:\
  \ 3.8.10\r\n- Click version: >8\r\n\r\nPS, transcript from running the reproducer\
  \ on macOS Catalina too, with python 3.9 from brew:\r\n\r\n```\r\n% mkdir click-bug\r\
  \n% cd click-bug \r\n% python3 -m venv venv\r\n% source venv/bin/activate\n"
