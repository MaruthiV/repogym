prompt: "Allow customizing fail message for invalid choice in `click.types.Choice`\n\
  \nMove the fail art of `convert()` in the `Choice` class to a new method `get_invalid_choice_fail_message(self)`\
  \ so in my subclass of `click.Choice` I can customize the way it shows the failing\
  \ value for the choice\r\n\r\nSome CLI option choices are multi-part meaning they\
  \ are separated by some value, like a comma separated list for example. Maybe each\
  \ section of this value represents a different part of a schema and it is nice to\
  \ show a custom message about the specific part.\r\n\r\nContrived version:\r\nLet\
  \ says my choices are `[\"maine::goat\", \"maine::themepark\"]` and I give it \"\
  maine::toast\"`, it'd be nice to say the `maine` part was correct and the `toast`\
  \ part was not.\n"
