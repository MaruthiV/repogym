prompt: "`required=True` does not work for flags\n\nWhen using a flag option, setting\
  \ `required=True` has no effect unless I also include `default=None`. I would expect\
  \ there to be no default if the flag is required.\r\n\r\n\r\n**Steps to reproduce:**\r\
  \n```\r\nimport click\r\n\r\n@click.command()\r\n@click.option('--foo/--no_foo',\
  \ is_flag=True, required=True)\r\ndef bar(foo):\r\n    pass\r\n\r\nif __name__ ==\
  \ '__main__':\r\n    bar()\r\n\r\n```\r\n\r\n`python test.py` runs without raising\
  \ an error.\r\n\r\nI would expect `python test.py` to raise:\r\n```\r\nUsage: test.py\
  \ [OPTIONS]\r\nTry 'test.py --help' for help.\r\n\r\nError: Missing option '--foo'.\r\
  \n```\r\n\r\nEnvironment:\r\n\r\n- Python version: 3.9.5\r\n- Click version: 8.0.1\n"
