prompt: "CliRunner and click.prompt doesn't work for testing \n\n### Summary\r\n\r\
  \nWhen testing a Click command with `CliRunner`, it appears that `click.prompt`\
  \ behaves unexpectedly in functional tests, especially when the terminal is not\
  \ a true TTY. Specifically, when using `CliRunner` to simulate input in tests, `click.prompt`\
  \ blocks indefinitely if more prompts are expected than input provided, making it\
  \ impossible to test these commands correctly. This behavior is different from running\
  \ the same code in a real shell environment, where input ends with EOF and the program\
  \ gracefully handles the prompt.\r\n\r\n### Minimal Reproducible Example (MRE)\r\
  \n\r\nHere is a minimal reproducible example that demonstrates the issue:\r\n\r\n\
  ```python\r\nimport click\r\nfrom click.testing import CliRunner\r\nfrom pytest\
  \ import fixture\r\n\r\n\r\n@click.command()\r\n@click.option(\"-n\", \"--count\"\
  , default=2)\r\ndef main(count):\r\n    sum = 0\r\n    for i in range(count + 1):\
  \  # +1 is a bug in the code\r\n        sum += click.prompt(f\"Enter number {i +\
  \ 1}\", type=int)\r\n    click.echo(f\"Sum: {sum}\")\r\n\r\n\r\n@fixture\r\ndef\
  \ runner():\r\n    return CliRunner()\r\n\r\n\r\ndef test_program(runner):\r\n \
  \   result = runner.invoke(main, args=[\"-n2\"], input=\"1\\n2\")\r\n    assert\
  \ \"3\" in result.output\r\n    assert result.exit_code == 0\r\n\r\n\r\nif __name__\
  \ == \"__main__\":\r\n    main()\r\n```\r\n\r\n### Expected Behavior\r\n\r\nIn this\
  \ example, there's a bug in the code (the `for` loop runs for `count + 1` iterations).\
  \ When testing using the `CliRunner`, we expect it to behave similarly to how the\
  \ program runs in a real shell environment. Specifically, when EOF is reached (input\
  \ ends), the test should either handle the prompt and output accordingly, or raise\
  \ an appropriate error that can be captured in a test.\r\n\r\nFor example, when\
  \ running the test program in a shell script:\r\n\r\n```bash\r\n#!/bin/bash\r\n\r\
  \noutput=$(echo -e \"1\\n2\\n\" | python main.py)\r\n\r\nif [[ \"$output\" == *\"\
  Sum: 3\"* ]]; then\r\n  echo \"Test passed!\"\r\n  exit 0\r\nelse\r\n  echo \"Test\
  \ failed!\"\r\n  echo \"Expected output: 'Sum: 3'\"\r\n  echo \"Actual output: $output\"\
  \r\n  exit 1\r\nfi\r\n```\r\n\r\nThe test does **not** block and can process input,\
  \ even though there's one extra prompt due to the bug.\r\n\r\n### Actual Behavior\r\
  \n\r\nWhen running the test with `pytest` using `CliRunner`, it blocks indefinitely\
  \ because `click.prompt` is waiting for additional input, even though the input\
  \ stream has ended:\r\n\r\n```bash\r\n$ python -mpytest main.py\r\n===== test session\
  \ starts =====\r\nplatform linux -- Python 3.13.0, pytest-8.3.3, pluggy-1.5.0\r\n\
  rootdir: /click-test\r\ncollected 1 item\r\n\r\nmain.py (blocking...)\r\n```\r\n\
  \r\n### Root Cause\r\n\r\nIt seems that `CliRunner` and Click's input handling behave\
  \ differently in non-TTY environments, especially around handling `click.prompt`.\
  \ When the terminal is not a true TTY, Click disables certain features (like colors)\
  \ and handles input differently. In this case, `click.prompt` appears to ignore\
  \ EOF signals, resulting in the test blocking indefinitely.\r\n\r\nIn contrast,\
  \ when piping input in a real shell, the EOF signal is respected, and the program\
  \ behaves as expected.\r\n\r\n### Possible Solutions\r\n\r\n- **Improve `CliRunner`\
  \ behavior**: `CliRunner` could simulate EOF and handle `click.prompt` more gracefully,\
  \ aligning with behavior in actual terminal sessions.\r\n- **Provide a clearer way\
  \ to handle prompts in non-TTY environments**: Currently, there is no obvious way\
  \ to handle situations like this during functional testing without a TTY. There\
  \ could be an enhancement to handle prompts better in non-interactive tests.\r\n\
  - **Document this behavior**: If this is the intended behavior, it should be clearly\
  \ documented that `CliRunner` behaves differently in non-TTY environments, especially\
  \ in relation to prompts and input streams.\r\n\r\n### Environment Details\r\n\r\
  \n- Python 3.13.0\r\n- Click 8.x\r\n- pytest 8.3.3\n"
