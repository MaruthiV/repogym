prompt: "Unable to see EOFError exception in the traceback with disabled standalone\
  \ mode\n\nAccording to the [docs](https://click.palletsprojects.com/en/8.0.x/exceptions/?highlight=standalone%20mode#what-if-i-don-t-want-that)\
  \ disabled standalone mode disables exception handling. However, click still suppresses\
  \ `EOFError` (as well as `KeyboardInterrupt`) exceptions from the stack trace due\
  \ to the `raise ... from None` construction, see:\r\n\r\nhttps://github.com/pallets/click/blob/0aec1168ac591e159baf6f61026d6ae322c53aaf/src/click/core.py#L1066-L1068\r\
  \n\r\nI'd suggest changing the [line](https://github.com/pallets/click/blob/0aec1168ac591e159baf6f61026d6ae322c53aaf/src/click/core.py#L1068)\
  \ to `raise Abort() from e`, so that users can see the original exception in the\
  \ stack trace.\r\n\r\nReal world example. I use asyncio streams that can [raise\
  \ IncompleteReadError](https://github.com/python/cpython/blob/d03acd7270d66ddb8e987f9743405147ecc15087/Lib/asyncio/exceptions.py#L29)\
  \ which inherited from `EOFError`, but I can't see the exception in the stack trace\
  \ even with disabled standalone mode which looks like a bug to me. \r\n\r\n**How\
  \ to replicate the bug:**\r\n\r\n1. Create the following script:\r\n```python\r\n\
  # t.py\r\nimport click\r\n\r\n\r\n@click.command()\r\ndef cli():\r\n    raise EOFError('I\
  \ want to see this exception')\r\n\r\n\r\nif __name__ == '__main__':\r\n    cli.main(standalone_mode=False)\r\
  \n```\r\n\r\n2. Run module `python -m t`\r\n\r\n**Actual behavior:**\r\n\r\n```python\r\
  \nTraceback (most recent call last):\r\n  File \"/Users/albert/.pyenv/versions/3.10.4/lib/python3.10/runpy.py\"\
  , line 196, in _run_module_as_main\r\n    return _run_code(code, main_globals, None,\r\
  \n  File \"/Users/albert/.pyenv/versions/3.10.4/lib/python3.10/runpy.py\", line\
  \ 86, in _run_code\r\n    exec(code, run_globals)\r\n  File \"/private/var/folders/l0/lnq1ghps5yqc4vkgszlcz92m0000gp/T/tmp.X1tRYLrm/t.py\"\
  , line 10, in <module>\r\n    cli.main(standalone_mode=False)\r\n  File \"/private/var/folders/l0/lnq1ghps5yqc4vkgszlcz92m0000gp/T/tmp.X1tRYLrm/.venv/lib/python3.10/site-packages/click/core.py\"\
  , line 1068, in main\r\n    raise Abort() from None\r\nclick.exceptions.Abort\r\n\
  ```\r\n\r\n**Expected behavior:**\r\n\r\n```python\r\nTraceback (most recent call\
  \ last):\r\n  File \"/private/var/folders/l0/lnq1ghps5yqc4vkgszlcz92m0000gp/T/tmp.X1tRYLrm/.venv/lib/python3.10/site-packages/click/core.py\"\
  , line 1055, in main\r\n    rv = self.invoke(ctx)\r\n  File \"/private/var/folders/l0/lnq1ghps5yqc4vkgszlcz92m0000gp/T/tmp.X1tRYLrm/.venv/lib/python3.10/site-packages/click/core.py\"\
  , line 1404, in invoke\r\n    return ctx.invoke(self.callback, **ctx.params)\r\n\
  \  File \"/private/var/folders/l0/lnq1ghps5yqc4vkgszlcz92m0000gp/T/tmp.X1tRYLrm/.venv/lib/python3.10/site-packages/click/core.py\"\
  , line 760, in invoke\r\n    return __callback(*args, **kwargs)\r\n  File \"/private/var/folders/l0/lnq1ghps5yqc4vkgszlcz92m0000gp/T/tmp.X1tRYLrm/t.py\"\
  , line 6, in cli\r\n    raise EOFError('I want to see this exception')\r\nEOFError:\
  \ I want to see this exception\r\n\r\nThe above exception was the direct cause of\
  \ the following exception:\r\n\r\nTraceback (most recent call last):\r\n  File \"\
  /Users/albert/.pyenv/versions/3.10.4/lib/python3.10/runpy.py\", line 196, in _run_module_as_main\r\
  \n    return _run_code(code, main_globals, None,\r\n  File \"/Users/albert/.pyenv/versions/3.10.4/lib/python3.10/runpy.py\"\
  , line 86, in _run_code\r\n    exec(code, run_globals)\r\n  File \"/private/var/folders/l0/lnq1ghps5yqc4vkgszlcz92m0000gp/T/tmp.X1tRYLrm/t.py\"\
  , line 10, in <module>\r\n    cli.main(standalone_mode=False)\r\n  File \"/private/var/folders/l0/lnq1ghps5yqc4vkgszlcz92m0000gp/T/tmp.X1tRYLrm/.venv/lib/python3.10/site-packages/click/core.py\"\
  , line 1068, in main\r\n    raise Abort() from e\r\nclick.exceptions.Abort\r\n```\r\
  \n\r\n\r\nEnvironment:\r\n\r\n- Python version: 3.10.4\r\n- Click version: 8.1.3\n"
