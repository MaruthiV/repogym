prompt: "Unexpected 413 - RequestEntityTooLarge response\n\n# Bug\r\nWhen sending\
  \ non utf-8 bytes into a form the flask server responds with `413 - RequestEntityTooLarge`.\
  \ This does not seem like the appropriate http error to return in this case. This\
  \ happens when using a flask app however it might be a bug in werkzeug.\r\n\r\n\r\
  \n# Reproduce unexpected behaviour:\r\napp.py:\r\n```py\r\nfrom flask import *\r\
  \n\r\napp = Flask(__name__)\r\n\r\n@app.route(\"/\", methods=[\"GET\", \"POST\"\
  ])\r\ndef home():\r\n    if request.method == \"POST\":\r\n        print(request.form[\"\
  name\"])\r\n        print(request.form[\"email\"])\r\n\r\n    return render_template(\"\
  home.html\")\r\n\r\nif __name__ == \"__main__\":\r\n    app.run()\r\n```\r\n\r\n\
  home.html:\r\n```html\r\n<h1>\r\n    This is home.html\r\n</h1>\r\n\r\n<form method=\"\
  post\">\r\n\r\n    Name: <input name=\"name\"/>\r\n\r\n    <br/><br/>\r\n\r\n  \
  \  Email: <input name=\"email\"/>\r\n\r\n    <br/><br/>\r\n\r\n    <button type=\"\
  submit\">Submit</button>\r\n</form>\r\n```\r\n\r\nbug.py:\r\n```py\r\nimport requests\r\
  \n\r\n\r\nif __name__ == '__main__':\r\n    response1 = requests.post(\r\n     \
  \   'http://localhost:5000',\r\n        b'\\x80',\r\n        headers={'Content-Type':'application/x-www-form-urlencoded',\
  \ 'Content-Length':str(len(b'\\x80'))}\r\n    )\r\n    print(\"response with only\
  \ \\x80 in content: \" + str(response1.status_code) + \"\\n\")\r\n    response2\
  \ = requests.post(\r\n        'http://localhost:5000',\r\n        b'name=john&email=doe\\\
  x80',\r\n        headers={'Content-Type': 'application/x-www-form-urlencoded', 'Content-Length':\
  \ str(len(b'\\x80'))}\r\n    )\r\n    print(\"response with \\x80 added to correctly\
  \ formatted response in content: \" + str(response2.status_code))\r\n```\r\n\r\n\
  \r\n\r\nEnvironment:\r\n\r\n- Python version: 3.10.12\r\n- Flask version: 3.0.3\n"
