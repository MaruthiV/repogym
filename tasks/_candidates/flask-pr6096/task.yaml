prompt: "IPv6 addresses parsed incorrectly because of `.partition(\":\")`?\n\nHi,\
  \ I checked the code and saw that two places use `.partition(\":\")` on addresses,\
  \ and IPv6 addresses contain \":\".\n\nThis breaks 1. `session_transaction` value\
  \ setting, and 2. `Flask.run()` if `SERVER_NAME` is set. I've already prepared two\
  \ tests that fail, you can use them to reproduce:\n\n1. In `test_testing.py`\n```\n\
  def test_session_transaction_ipv6(app):\n    base_url = \"http://[::1]:8000/\"\n\
  \    client = app.test_client()\n\n    @app.get(\"/\")\n    def index():\n     \
  \   return str(flask.session.get(\"value\"))\n\n    with client.session_transaction(base_url=base_url)\
  \ as sess:\n        sess[\"value\"] = 42\n\n    assert client.get(\"/\", base_url=base_url).text\
  \ == \"42\"\n```\n\n2. Add one case to `test_run_from_config`\n```\n(None, None,\
  \ \"[::1]:8080\", \"::1\", 8080),\n```\n\nIs this known and intended? I could send\
  \ the patches for these two places.\n"
