prompt: "Allow `params` attribute in decorators\n\nCurrently it is not possible to\
  \ pass `params` attribute to `@command()` and `@group()` decorators.\r\nThis would\
  \ be really simple implementation, which can be seen in [this forked commit](https://github.com/kristianheljas/click/commit/4e908df69ab11eb333fa14bcf4f3b54b77810ef4)\r\
  \n\r\nAlthough, this allows to mix decorator and class patterns, there are a few\
  \ advantages as well:\r\n\r\n1. Share same option spec between (sub)commands (consider\
  \ CRUD subcommands which all have `--force` option, except `read`)\r\nIt can be\
  \ done with nested decorators, which hurt readability\r\n2. Take advantage of IDE\
  \ auto-completion when using `Option()` class instead of decorator ([PEP-612](https://www.python.org/dev/peps/pep-0612/)\
  \ would resolve this, but it requires python >=3.10)\r\n\r\nIf this is something\
  \ to be considered, I can follow up with a PR.\r\n\r\nExample usage:\r\n\r\n```python\r\
  \nimport click\r\n\r\n@click.group()\r\ndef crud():\r\n    ...\r\n\r\nwrite_args\
  \ = [\r\n    click.Option(['--force'], is_flag=True)\r\n]\r\n\r\n@crud.command(params=write_args)\r\
  \ndef create():\r\n    ...\r\n\r\n@crud.command(params=write_args)\r\n@click.option('--create',\
  \ is_flag=True) # Should this be appended or prepended to `write_args`?\r\ndef update():\r\
  \n    ...\r\n\r\n@crud.command(params=write_args)\r\ndef delete():\r\n    ...\r\n\
  \r\n@crud.command()\r\ndef read():\r\n    ...\r\n```\n"
