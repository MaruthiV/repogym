prompt: "Arguments may break `--help`\n\nUsing `click.Path` for an argument may prevent\
  \ the `--help` from showing up. A simple example is the following:\r\n\r\n```\r\n\
  @click.command()\r\n@click.option(\r\n    \"-f\",\r\n    type=click.Path(exists=True,\
  \ file_okay=True),\r\n    default=\"this does not exist\",\r\n    help=\"Output\
  \ file name\",\r\n    show_default=True,\r\n)\r\ndef cli():\r\n    pass\r\n```\r\
  \n\r\nWhen trying to print the `--help` the default argument will be checked for\
  \ validity and instead print an error that `-f` is an invalid value.\r\n\r\nEnvironment:\r\
  \n\r\n- Python version: Python 3.8.9\r\n- Click version: 8.0.0\n"
