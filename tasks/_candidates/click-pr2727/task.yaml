  \ I use the Click `progressbar` I find myself wanting to conditionally hide it.\
  \ Sometimes it's because there's another option in play which means I have output\
  \ to display in place of it - others it's because I added a `--silent` option (as\
  \ seen in `curl`) for disabling it entirely.\r\n\r\nIt's actually a bit tricky doing\
  \ this at the moment, due to its use as a context manager.\r\n\r\nWhat I'd really\
  \ like to be able to do is this:\r\n\r\n```python\r\nhide = True  # or False depending\
  \ on various things\r\n\r\nwith click.progressbar(items, show_eta=True, hide=hide):\r\
