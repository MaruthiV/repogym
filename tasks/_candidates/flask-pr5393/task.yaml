prompt: "Flask 3.0.1 breaks path-separated command line arguments\n\nIn a minimal\
  \ flask app, running `flask run --extra-files=` or using any other argument that\
  \ internally uses `SeparatedPathType` results in `TypeError: super(type, obj): obj\
  \ must be an instance or subtype of type`\r\n\r\n\r\n\r\n1. Create a minimal flask\
  \ application (follow [the Quickstart](https://flask.palletsprojects.com/en/3.0.x/quickstart/#a-minimal-application)).\r\
  \n2. Install flask==3.0.1 (this bug is not reproducible with 3.0.0 AFAIK)\r\n3.\
  \ Run `flask run --extra-files=a`\r\n\r\n**Expected Behavior:**\r\nThe server should\
  \ start up.\r\n\r\n**Actual Behavior:**\r\nThe command raises a `Type Error` and\
  \ exits with code 1\r\n\r\n<details><summary>Full Traceback</summary>\r\n\r\n```\r\
  \nTraceback (most recent call last):\r\n  File \".../flask-cli-bug/..venv/bin/flask\"\
  , line 8, in <module>\r\n    sys.exit(main())\r\n             ^^^^^^\r\n  File \"\
  .../flask-cli-bug/..venv/lib/python3.11/site-packages/flask/cli.py\", line 1105,\
  \ in main\r\n    cli.main()\r\n  File \".../flask-cli-bug/..venv/lib/python3.11/site-packages/click/core.py\"\
  , line 1078, in main\r\n    rv = self.invoke(ctx)\r\n         ^^^^^^^^^^^^^^^^\r\
  \n  File \".../flask-cli-bug/..venv/lib/python3.11/site-packages/click/core.py\"\
  , line 1686, in invoke\r\n    sub_ctx = cmd.make_context(cmd_name, args, parent=ctx)\r\
  \n              ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\r\n  File \".../flask-cli-bug/..venv/lib/python3.11/site-packages/click/core.py\"\
  , line 943, in make_context\r\n    self.parse_args(ctx, args)\r\n  File \".../flask-cli-bug/..venv/lib/python3.11/site-packages/click/core.py\"\
  , line 1408, in parse_args\r\n    value, args = param.handle_parse_result(ctx, opts,\
  \ args)\r\n                  ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\r\n  File\
  \ \".../flask-cli-bug/..venv/lib/python3.11/site-packages/click/core.py\", line\
  \ 2400, in handle_parse_result\r\n    value = self.process_value(ctx, value)\r\n\
  \            ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\r\n  File \".../flask-cli-bug/..venv/lib/python3.11/site-packages/click/core.py\"\
  , line 2356, in process_value\r\n    value = self.type_cast_value(ctx, value)\r\n\
  \            ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\r\n  File \".../flask-cli-bug/..venv/lib/python3.11/site-packages/click/core.py\"\
  , line 2344, in type_cast_value\r\n    return convert(value)\r\n           ^^^^^^^^^^^^^^\r\
  \n  File \".../flask-cli-bug/..venv/lib/python3.11/site-packages/click/core.py\"\
  , line 2316, in convert\r\n    return self.type(value, param=self, ctx=ctx)\r\n\
  \           ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\r\n  File \".../flask-cli-bug/..venv/lib/python3.11/site-packages/click/types.py\"\
  , line 83, in __call__\r\n    return self.convert(value, param, ctx)\r\n       \
  \    ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\r\n  File \".../flask-cli-bug/..venv/lib/python3.11/site-packages/flask/cli.py\"\
  , line 861, in convert\r\n    return [super().convert(item, param, ctx) for item\
  \ in items]\r\n           ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\r\
  \n  File \".../flask-cli-bug/..venv/lib/python3.11/site-packages/flask/cli.py\"\
  , line 861, in <listcomp>\r\n    return [super().convert(item, param, ctx) for item\
  \ in items]\r\n            ^^^^^^^\r\nTypeError: super(type, obj): obj must be an\
  \ instance or subtype of type\r\n```\r\n</details>\r\n\r\nEnvironment:\r\n\r\n-\
  \ Python version: 3.11.6\r\n- Flask version: 3.0.1\r\n\r\nOutput from `pip freeze`:\r\
  \n```\r\nblinker==1.7.0\r\nclick==8.1.7\r\nFlask==3.0.1\r\nitsdangerous==2.1.2\r\
  \nJinja2==3.1.3\r\nMarkupSafe==2.1.4\r\nWerkzeug==3.0.1\r\n```\r\n\r\nDemo Repo:\
  \ https://github.com/alexrudy/flask-3.0.1-cli-bug\n"
