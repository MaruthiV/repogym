prompt: |
  Every JSON POST from our web clients started getting 415 Unsupported Media
  Type. Clients send `Content-Type: application/json; charset=utf-8` (browsers
  add the charset automatically) and our routes use the AllowContentType
  middleware with "application/json". Requests with a bare
  `Content-Type: application/json` still work fine.

  Media type parameters like charset should not affect the whitelist match.
  Fix the middleware.
