language: go
category: bug_fix
level: L2
source: mutated
prompt: |
  "Did you mean this?" suggestions stopped working for partial command names.

  Typing a short prefix of a real subcommand (e.g. `mycli conf` where the CLI
  has a `configuration` command) used to suggest the full command under the
  unknown-command error. Now it prints the error with no suggestion at all.
  Misspellings that are close in edit distance (like `tiems` for `times`) still
  get suggestions fine — only the prefix-based ones are gone.

  Find and fix the regression.
