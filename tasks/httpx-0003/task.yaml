  patch: tests.patch
  fail_to_pass:
    - tests/models/test_queryparams.py::test_queryparam_types
    - "tests/test_content.py::test_urlencoded_boolean[asyncio]"
    - tests/test_repogym_bool_encoding.py::test_boolean_query_params_use_json_style
    - tests/test_repogym_bool_encoding.py::test_boolean_form_fields_use_json_style
  pass_to_pass:
