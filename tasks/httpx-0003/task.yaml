id: httpx-0003
repo: encode/httpx
base_commit: b5addb64f0161ff6bfe94c124ef76f6a1fba5254
language: python
category: bug_fix
level: L2
source: mutated
prompt: |
  Boolean values in query params and form data started serializing in Python
  repr style instead of JSON style. `params={"active": True}` now produces
  `active=True` on the wire and our backend (which expects `active=true`, as
  httpx has always sent) rejects the requests. Same for urlencoded form fields
  and multipart data. String and integer values are unaffected.

  Restore the documented JSON-style true/false serialization.
mutation_patch: bug.patch
