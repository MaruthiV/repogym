prompt: "Filters decorated with @async_variant are not pickleable \n\nThe [`jinja2.async_utils.async_variant`][async_variant]\
  \ decorator puts the wrong `__name__` and `__qualname__` on the decorated function.\
  \  One result of this is that functions which it decorates are not pickleable.\r\
  \n\r\n\r\nHere's a doctest script which illustrates the issue.\r\n```pycon\r\n>>>\
  \ import pickle\r\n>>> import jinja2.filters\r\n\r\n>>> pickle.dumps(jinja2.filters.do_first)\r\
  \nTraceback (most recent call last):\r\n    ...\r\n_pickle.PicklingError: Can't\
  \ pickle <function sync_do_first at 0x...>: it's not the same object as jinja2.filters.sync_do_first\r\
  \n\r\n# Here's the crux:\r\n>>> jinja2.filters.do_first.__name__\r\n'sync_do_first'\r\
  \n```\r\n\r\n[async_variant]: https://github.com/pallets/jinja/blob/09907ef37891be76ab0a1a3dc1a3f7df667db959/src/jinja2/async_utils.py#L11\r\
  \n\r\n\r\n\r\nEnvironment:\r\n\r\n- Python version: 3.10 — but I don't think that's\
  \ important\r\n- Jinja version: git main (09907ef37891be76ab0a1a3dc1a3f7df667db959)\
  \ — but I think this affects all versions >= 3\r\n\r\nI will submit a PR with one\
  \ possible fix shortly.\n"
