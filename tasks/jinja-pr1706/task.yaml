prompt: "The error message from PackageLoader could be more helpful\n\nWhen following\
  \ [the basics of setting up jinja2](https://jinja.palletsprojects.com/en/3.1.x/api/#basics),\
  \ if you don't create the appropriate `templates` directory in your package, you\
  \ get this error message:\r\n\r\n```\r\nValueError: The 'mypackage' package was\
  \ not installed in a way that PackageLoader understands.\r\n```\r\n\r\nThis could\
  \ be significantly improved by explaining the actual problem: The PackageLoader\
  \ could not find a suitable \"templates\" directory.\r\n\r\nTo replicate, add this\
  \ to `mypackage.py`:\r\n\r\n```python\r\nfrom jinja2 import Environment, PackageLoader\r\
  \n\r\n\r\nenv = Environment(loader=PackageLoader(\"mypackage\"))\r\n```\r\n\r\n\
  If you run `python mypackage.py` you will see a traceback similar to this:\r\n\r\
  \n```python\r\nTraceback (most recent call last):\r\n  File \"mypackage/mypackage.py\"\
  , line 4, in <module>\r\n    env = Environment(loader=PackageLoader(\"mypackage\"\
  ))\r\n  File \".virtualenvs/mypackage/lib/python3.10/site-packages/jinja2/loaders.py\"\
  , line 291, in __init__\r\n    import_module(package_name)\r\n  File \".pyenv/versions/3.10.3/lib/python3.10/importlib/__init__.py\"\
  , line 126, in import_module\r\n    return _bootstrap._gcd_import(name[level:],\
  \ package, level)\r\n  File \"<frozen importlib._bootstrap>\", line 1050, in _gcd_import\r\
  \n  File \"<frozen importlib._bootstrap>\", line 1027, in _find_and_load\r\n  File\
  \ \"<frozen importlib._bootstrap>\", line 1006, in _find_and_load_unlocked\r\n \
  \ File \"<frozen importlib._bootstrap>\", line 688, in _load_unlocked\r\n  File\
  \ \"<frozen importlib._bootstrap_external>\", line 883, in exec_module\r\n  File\
  \ \"<frozen importlib._bootstrap>\", line 241, in _call_with_frames_removed\r\n\
  \  File \"mypackage/mypackage.py\", line 4, in <module>\r\n    env = Environment(loader=PackageLoader(\"\
  mypackage\"))\r\n  File \".virtualenvs/mypackage/lib/python3.10/site-packages/jinja2/loaders.py\"\
  , line 323, in __init__\r\n    raise ValueError(\r\nValueError: The 'mypackage'\
  \ package was not installed in a way that PackageLoader understands.\r\n\r\n```\r\
  \n\r\nSeeing an error message that explained that jinja2 couldn't find an appropriate\
  \ \"templates\" directory would be much better.\r\n\r\nEnvironment:\r\n\r\n- Python\
  \ version: 3.10.3\r\n- Jinja version: 3.1.2\n"
