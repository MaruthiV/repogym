prompt: "custom filters with async_true enabled giving 'coroutine' object is not subscriptable\
  \ error\n\n**Description**\r\nWhen applying a custom (synchronous) filter to a passed\
  \ in object in a for loop, we are getting a `TypeError: 'coroutine' object is not\
  \ subscriptable` Error. It seems to be an extension of this issue: https://github.com/pallets/jinja/issues/1141\r\
  \n\r\n\r\n**Reproduction**\r\nVery similar to the above issue, you can minimally\
  \ reproduce like:\r\n\r\n`{% for item in (a.b|add_two(5))[:1] %}{{ item }}{% endfor\
  \ %}`\r\nwith a jinja environment of:\r\n```\r\njinja_env = jinja2.Environment(enable_async=True)\r\
  \njinja_env.filters.update({'add_two': lambda x, y: [i+y for i in x]})\r\n```\r\n\
  \r\nrendering with `a=dict(b=[1,2,3])` will result in the `'coroutine' object is\
  \ not subscriptable`\r\n\r\nWe tried removing the parenthesis around the method\
  \ call:\r\n`{% for item in a.b|add_two(5)[:1] %}{{ item }}{% endfor %}`\r\nbut that\
  \ results in a different `jinja2.exceptions.TemplateSyntaxError: expected token\
  \ 'end of statement block', got '['` error\r\n\r\n\r\n**Environment**\r\n\r\n- Python\
  \ version: 3.9\r\n- Jinja version: 3.0.3\n"
