prompt: "[BUG] Recorded content not expected for captured prints\n\n**Describe the\
  \ bug**\r\n\r\nThe following code:\r\n```python\r\n    console = Console(record=True)\r\
  \n    print(\"Before Capture started:\")\r\n    console.print(\"[blue underline]Print\
  \ 0\")\r\n    with console.capture() as capture:\r\n        console.print(\"[blue\
  \ underline]Print 1\")\r\n        console.print(\"[blue underline]Print 2\")\r\n\
  \        console.print(\"[blue underline]Print 3\")\r\n        console.print(\"\
  [blue underline]Print 4\")\r\n    print(\"\\nCaptured content:\")\r\n    print(capture.get())\r\
  \n    print(\"\\nRecorded content:\")\r\n    print(console.export_text())\r\n```\r\
  \nProduces following output:\r\n\r\n\r\n\r\nIt seems that every print to capture\
  \ adds previously printed content + new content.\r\n\r\nI also wonder if the captured\
  \ content should even go to the recording because it won't even go to console unless\
  \ specifically printed there after capturing has been stopped.\r\n\r\nThough, as\
  \ it seems that captured content cannot be printed with `console.print()` (control\
  \ codes seems to becomes visible) so by using regular python print() would not put\
  \ it in the recording either.\r\n(Line `print(capture.get())` replaced with `console.print(capture.get())`)\r\
  \n\r\n\r\n\r\n\r\n\r\n**Platform**\r\n<details>\r\n<summary>Click to expand</summary>\r\
  \n\r\nSame with Win/Linux platforms.\r\nWindows terminal: Cmd prompt, Windows Terminal.\r\
  \nLinux Terminal: Putty\r\n\r\nUsing Rich version 12.6.0\r\n\r\n</details>\n"
