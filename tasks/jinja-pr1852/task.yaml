prompt: "f-string sytax error when importing macro in a template which filename is\
  \ also a template\n\nWith this template structure:\r\n```\r\n/templates/\r\n+- {%\
  \ jinja expr %}.jinja\r\n+- macro_file.jina\r\n```\r\nWhen `{% jinja expr %}.jinja`\
  \ imports a macro using 'from \"macro_file.jinja\" import my_macro' syntax, Environment.render\
  \ fails with `SyntaxError: f-string: invalid syntax` error message.\r\n\r\nInternally\
  \ jinja concatenates the importing template filename into an f-string, which results\
  \ with invalid f-string:\r\n```python\r\nif l_0_print_helo is missing:\r\n     \
  \   l_0_print_helo = undefined(f\"the template {included_template.__name__!r} (imported\
