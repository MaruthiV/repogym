  \ name 'print_helo'\", name='print_helo')\r\n```\r\n\r\nCouldn't reproduce the error\
  \ using `import \"macro_file.jinja\" as m` syntax.\r\n\r\nEnvironment:\r\n\r\n-\
  \ Python 3.10.7\r\n- Jinja 3.1.2\n"
