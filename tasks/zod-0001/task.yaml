prompt: |
  `z.number().multipleOf(0.07)` rejects `2.03`, but 0.07 * 29 = 2.03 — it IS an
  exact decimal multiple. Same with other decimal steps: values that are true
  multiples fail validation with "Invalid number: must be a multiple of 0.07".

  Integer steps work fine. This looks like a floating-point precision issue in
  the multipleOf check. Please fix the underlying validation logic so exact
  decimal multiples pass, without breaking rejection of true non-multiples.
