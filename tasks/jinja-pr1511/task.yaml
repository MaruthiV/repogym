prompt: "Native types for macros\n\nWith [native types](https://jinja.palletsprojects.com/en/3.0.x/nativetypes/)\
  \ we can template out native Python types, which is useful in for example Ansible.\r\
  \n\r\nIt seems that macros always generate strings though, even in a native environment.\
  \ Would it be possible to make macros output native types as well, so they are more\
  \ useful when building up a native data structure?\r\n\r\nFor (a trivial) example,\
  \ I would like this to output the integer 5, not the string \"[\".\r\n```\r\nenv.from_string(\"\
  {%- macro x() -%}{{- [5,6] -}}{%- endmacro -%}{{- x()[0] -}}\").render()\r\n```\n"
