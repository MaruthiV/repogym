prompt: "Undefined objects can't be copied or pickled by Python > 3.5\n\n### Description\r\
  \nDue to [an ancient erroneous deletion of `__slots__` metadata](https://github.com/pallets/jinja/blob/3.1.4/src/jinja2/runtime.py#L1049-L1056),\
  \ it's not possible to copy/deepcopy/pickle `Undefined` objects (all of which we\
  \ occasionally need to do in Ansible) in Python > 3.5.\r\n\r\nThe comment above\
  \ the deletion of `__slots__` implies a misunderstanding of how that metadata was/is\
  \ used. The deletion was always probably technically a bug, but once Python started\
  \ providing default implementations of `__getstate__` and `__reduce_ex__` on all\
  \ objects (which consult that metadata at runtime), it broke the default copyability/pickle-ability\
  \ of `Undefined` (and derived) objects.\r\n\r\nWe're working around this with a\
  \ monkeypatch that restores the missing `__slots__` metadata. We've also submitted\
  \ PR  #2026 to zap the problematic deletion and tests that verify copy/deepcopy/pickle\
  \ functionality on all the built-in `Undefined` types.\r\n\r\n### Repro\r\n\r\n\
  (on any Python > 3.5 with Jinja installed):\r\n```\r\n$ python -c 'import copy;\
  \ import jinja2; copy.copy(jinja2.Undefined())'\r\nTraceback (most recent call last):\r\
  \n  File \"<string>\", line 1, in <module>\r\n  File \"/usr/lib64/python3.11/copy.py\"\
  , line 92, in copy\r\n    rv = reductor(4)\r\n         ^^^^^^^^^^^\r\nTypeError:\
  \ cannot pickle 'Undefined' object\r\n```\r\n\r\n### Expected\r\nThe default runtime-provided\
  \ implementations of `__getstate__` and `__reduce_ex__` that back `copy.copy`, `copy.deepcopy`\
  \ and `pickle` should work properly with all `Undefined` derived types.\r\n\r\n\
  ### Environment\r\n\r\n- Python version: >= 3.6\r\n- Jinja version: anything from\
  \ at least the past 16 years\n"
