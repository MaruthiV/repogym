id: httpx-0001
repo: encode/httpx
base_commit: b5addb64f0161ff6bfe94c124ef76f6a1fba5254
language: python
category: bug_fix
level: L2
source: mutated
prompt: |
  POST requests that pass an in-memory stream as content upload an EMPTY body.

      httpx.post("https://example.org/upload", content=io.BytesIO(data))

  sends zero body bytes (the server receives an empty payload), even though the
  Content-Length header is set to the correct full size. Uploading from a real
  file object opened from disk works fine; only in-memory streams like BytesIO
  are affected. This worked in the previous release we were on.

  Track down and fix the underlying bug.
